<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NanoClaw 网页端</title>
<meta name="page-version" content="__NC_PAGE_VERSION__" />
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e8ec; --muted:#9aa3b2; --accent:#538bf0; --ok:#3ecf8e; --think:#2a2333; --think-line:#4a3a5e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:500; }
  header .status { font-size:12px; color:var(--muted); margin-left:auto; }
  header button { background:var(--panel); color:var(--txt); border:1px solid var(--line);
                  border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13px; }
  header button:hover { border-color:var(--accent); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:0; border-radius:12px; }
  .msg.user { align-self:flex-end; }
  .msg.user .bubble { background:var(--accent); color:#fff; padding:9px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.bot { align-self:flex-start; width:88%; display:flex; flex-direction:column; gap:8px; }
  .msg.sys { align-self:center; background:transparent; color:var(--muted); font-size:12px; }

  /* —— 思考过程面板：独立分区、默认折叠、点开看 —— */
  .think { border:1px solid var(--think-line); border-radius:10px; background:var(--think); overflow:hidden; }
  .think .sum { cursor:pointer; padding:7px 11px; color:#c8b6e0; font-size:12px; user-select:none; display:flex; align-items:center; gap:6px; }
  .think .sum::before { content:"▸"; font-size:10px; }                 /* 折叠态箭头 */
  .think:not(.collapsed) .sum::before { content:"▾"; }                 /* 展开态箭头 */
  .think .sum-label { white-space:nowrap; }
  .think .sum-dur { color:#9a86bd; white-space:nowrap; }
  .think .sum-preview { flex:1; min-width:0; color:#a895c4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }  /* 单行预览 */
  .think.live .sum::after { content:" ● 思考中"; color:var(--accent); animation:blink 1s steps(2,start) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .think .think-body { padding:4px 11px 9px; color:#b9a9d6; white-space:pre-wrap; word-break:break-word;
                border-top:1px dashed var(--think-line); max-height:260px; overflow:auto; font-size:13px; line-height:1.55; display:none; }
  .think:not(.collapsed) .think-body { display:block; }               /* 仅展开时显示全文 */

  /* —— 工具活动卡片：默认折叠，长内容收起，点开看详情 —— */
  .activity { display:flex; flex-direction:column; gap:6px; }
  .tool-card { font-size:12px; border:1px solid var(--line); border-radius:10px; background:#11141a; overflow:hidden; }
  .tool-card .tc-head { cursor:pointer; padding:6px 10px; color:#7fd1ff; display:flex; gap:6px; align-items:center; }
  .tool-card .tc-head::before { content:"▸"; font-size:10px; }
  .tool-card.expanded .tc-head::before { content:"▾"; }
  .tool-card .tc-name { font-weight:600; }
  .tool-card .tc-status { margin-left:auto; color:var(--muted); white-space:nowrap; }
  .tool-card .tc-dur { color:#6fa8c7; white-space:nowrap; }     /* 工具执行耗时，与思考面板 .sum-dur 同思路 */
  .tool-card .tc-args { display:none; padding:0 10px 6px; color:#aeb6c4; white-space:pre-wrap; word-break:break-word;
                        font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; }
  .tool-card .tc-result { display:none; padding:6px 10px; color:#9fe6c0; white-space:pre-wrap; word-break:break-word;
                         border-top:1px dashed var(--line); font-size:11px; max-height:180px; overflow:auto; }
  .tool-card.expanded .tc-args { display:block; }                      /* 展开才看入参 */
  .tool-card.expanded.has-result .tc-result { display:block; }         /* 有结果才展示出参 */

  /* —— 子 Agent：嵌在父回合内，事件和正文均不混入主回答 —— */
  .subagents { display:flex; flex-direction:column; gap:6px; }
  .subagent { border:1px solid #37506e; border-radius:10px; background:#121923; overflow:hidden; }
  .subagent .sa-head { cursor:pointer; padding:7px 10px; color:#9bc9ff; font-size:12px; display:flex; gap:6px; align-items:center; }
  .subagent .sa-head::before { content:"▸"; font-size:10px; }
  .subagent.expanded .sa-head::before { content:"▾"; }
  .subagent .sa-name { font-weight:600; }
  .subagent .sa-depth, .subagent .sa-dur { color:#7fa5d0; white-space:nowrap; }
  .subagent .sa-status { margin-left:auto; white-space:nowrap; color:var(--muted); }
  .subagent.live .sa-status { color:var(--accent); }
  .subagent .sa-body { display:none; padding:0 10px 10px; border-top:1px dashed #37506e; }
  .subagent.expanded .sa-body { display:block; }
  .subagent .sa-output { color:#b9cce1; white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.5; max-height:150px; overflow:auto; }
  .subagent .sa-tools { display:flex; flex-direction:column; gap:5px; margin-top:7px; }

  /* —— 正式回答：与思考过程明显分隔 —— */
  .answer-wrap { border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  .answer-label { padding:6px 11px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--line); letter-spacing:.04em; }
  .answer { padding:9px 12px; white-space:pre-wrap; word-break:break-word; line-height:1.65; min-height:20px; }
  .answer.empty::after { content:"生成中…"; color:var(--muted); }

  #bar { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #bar input[type=text] { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--txt);
               border-radius:10px; padding:10px 12px; font-size:14px; outline:none; }
  #bar input[type=text]:focus { border-color:var(--accent); }
  #bar button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 18px; font-size:14px; cursor:pointer; }
  #bar #attachBtn, #bar #recordBtn, #bar #ttsBtn { background:var(--panel); color:var(--txt); border:1px solid var(--line); padding:0 12px; font-size:16px; }
  #bar #attachBtn:hover, #bar #recordBtn:hover, #bar #ttsBtn:hover { border-color:var(--accent); }
  #bar #ttsBtn.enabled { color:var(--ok); border-color:var(--ok); }
  #bar #recordBtn.recording { background:#b13d4b; border-color:#e86b78; color:#fff; }
  /* 停止键：回合进行中 sendBtn 变「⏹ 停止」，红色警示；防重复点击时禁用 */
  #bar #sendBtn.stop { background:#b13d4b; border-color:#e86b78; }
  #bar #sendBtn:disabled { opacity:.6; cursor:default; }

  /* —— 待发送图片预览条（粘贴/选择后、发送前）—— */
  #attach { display:none; gap:8px; padding:8px 16px 0; flex-wrap:wrap; }
  #attach.show { display:flex; }
  .att-item { position:relative; width:56px; height:56px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
  .att-item img { width:100%; height:100%; object-fit:cover; display:block; }
  .att-item .att-del { position:absolute; top:0; right:0; background:rgba(0,0,0,.55); color:#fff; border:none;
                       cursor:pointer; font-size:11px; line-height:1; padding:2px 5px; border-radius:0 0 0 6px; }
  .att-item .att-del:hover { background:rgba(255,107,107,.85); }

  /* —— 消息里的图片条（用户气泡下方 / 历史回放）—— */
  .img-strip { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; justify-content:flex-end; }
  .img-strip img { max-width:180px; max-height:180px; border-radius:8px; border:1px solid var(--line); display:block; }
  /* 机器人回合内联生成的图片：左对齐，放在「工具活动」与「正式回答」之间 */
  .bot-images { justify-content:flex-start; margin-top:8px; }
  .bot-images img { max-width:360px; max-height:360px; }
  #config { display:none; padding:16px; border-top:1px solid var(--line); overflow-y:auto; max-height:55vh; }
  #config.show { display:block; }
  #config h2 { font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:500; }
  #config label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  #config input { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt);
                  border-radius:8px; padding:8px 10px; font-size:13px; margin-bottom:10px; outline:none; }
  #config input:focus { border-color:var(--accent); }
  #config .row { display:flex; gap:10px; }
  #config .row > div { flex:1; }
  #config .actions { display:flex; gap:10px; margin-top:6px; }
  #config .actions button { flex:1; padding:9px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid var(--line); }
  #saveBtn { background:var(--ok); color:#06281c; border:none; font-weight:500; }
  #cfgMsg { font-size:12px; color:var(--muted); }

  /* —— 会话侧边栏布局 —— */
  #app { flex:1; display:flex; min-height:0; overflow:hidden; }
  #sidebar { width:264px; flex:none; border-right:1px solid var(--line); background:var(--panel);
             display:flex; flex-direction:column; min-height:0; }
  #sidebar .sb-head { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  #sidebar .sb-head h2 { font-size:13px; margin:0; font-weight:500; }
  #sidebar .sb-head button { margin-left:auto; background:var(--accent); color:#fff; border:none;
                             border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; }
  #sidebar .sb-head button:hover { filter:brightness(1.1); }
  #sidebar .sb-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .sb-item { position:relative; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
             cursor:pointer; background:#11141a; }
  .sb-item:hover { border-color:var(--accent); }
  .sb-item.active { border-color:var(--accent); background:#1b2230; }
  .sb-item .sb-title { font-size:13px; color:var(--txt); white-space:nowrap; overflow:hidden;
                       text-overflow:ellipsis; padding-right:24px; }
  .sb-item .sb-preview { font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap;
                         overflow:hidden; text-overflow:ellipsis; }
  .sb-item .sb-time { font-size:10px; color:var(--muted); margin-top:3px; }
  .sb-item .sb-del { position:absolute; top:6px; right:6px; background:transparent; border:none;
                     color:var(--muted); cursor:pointer; font-size:12px; line-height:1; padding:2px 5px;
                     border-radius:6px; }
  .sb-item .sb-del:hover { color:#ff6b6b; background:rgba(255,107,107,.12); }
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
</style>
</head>
<body>
<header>
  <h1>NanoClaw 网页端</h1>
  <span class="status" id="status">连接中…</span>
  <button id="cfgBtn">配置</button>
</header>

<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <h2>会话</h2>
      <button id="newBtn">＋ 新会话</button>
    </div>
    <div class="sb-list" id="sbList"></div>
  </aside>
  <div id="main">
    <div id="chat"></div>

<div id="config">
  <h2>模型与接口</h2>
  <label>API Key</label><input id="api_key" type="password" placeholder="留空则用环境变量" />
  <label>Base URL</label><input id="base_url" />
  <div class="row"><div><label>主模型</label><input id="model" /></div><div><label>子 Agent 模型</label><input id="subagent_model" /></div></div>
  <label>最大迭代次数</label><input id="max_iterations" type="number" />
  <label>单轮超时（秒）</label><input id="turn_timeout_sec" type="number" min="30" step="30" />

  <h2>工作区与人设</h2>
  <label>工作区目录</label><input id="workspace" />
  <label>实例默认 IANA 时区</label><input id="timezone" placeholder="Asia/Shanghai" />
  <label>人设文件名</label><input id="identity_file" />

  <h2>飞书渠道（可选）</h2>
  <div class="row"><div><label>App ID</label><input id="feishu_app_id" /></div><div><label>App Secret</label><input id="feishu_app_secret" type="password" /></div></div>

  <h2>网页渠道</h2>
  <div class="row"><div><label>监听地址</label><input id="web_host" /></div><div><label>端口</label><input id="web_port" type="number" /></div></div>

  <div class="actions">
    <button id="reloadBtn">重新加载</button>
    <button id="saveBtn">保存配置</button>
  </div>
  <div id="cfgMsg"></div>
</div>

    <div id="attach"></div>
    <div id="bar">
      <button id="attachBtn" title="上传图片（也可直接粘贴）">🖼</button>
      <input id="fileInput" type="file" accept="image/*" multiple style="display:none" />
      <button id="recordBtn" title="开始录音">🎙</button>
      <button id="ttsBtn" title="开启自动朗读" aria-label="开启自动朗读" aria-pressed="false">🔇</button>
      <input id="input" type="text" placeholder="输入消息，回车发送；可粘贴/上传图片；/new 开新会话，/clear 清当前" autocomplete="off" />
      <button id="sendBtn">发送</button>
    </div>
  </div><!-- /#main -->
</div><!-- /#app -->

<script>
(function () {
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  // —— 聊天区 sticky scroll：贴底才自动跟随，用户上滑读历史时不被拉回 ——
  var nearBottom = true;   // 是否在底部附近（阈值 80px）；贴底才自动滚动到底
  function scrollChatToBottom() {
    if (nearBottom) chat.scrollTop = chat.scrollHeight;
  }
  chat.addEventListener('scroll', function () {
    nearBottom = (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80);
  });
  var statusEl = document.getElementById('status');
  var cfgBtn = document.getElementById('cfgBtn');
  var cfgPanel = document.getElementById('config');
  var cfgMsg = document.getElementById('cfgMsg');
  var FIELDS = ['api_key','base_url','model','subagent_model','workspace','timezone','max_iterations','turn_timeout_sec','identity_file','feishu_app_id','feishu_app_secret','web_host','web_port'];

  // —— 网页 TTS：只消费本页收到的、实时 Agent token；不保存开关状态 ——
  var ttsBtn = document.getElementById('ttsBtn');
  var ttsEnabled = false;
  var ttsGeneration = 0;       // 失效旧 fetch / 音频，防止关闭后迟到播放
  var ttsReplySeq = 0;
  var ttsQueue = [];           // 待合成文本；最多积压三段，过快时合并末段
  var ttsPrepared = {};        // seq -> 已合成音频；乱序返回也不改变播放顺序
  var ttsInFlight = 0;
  var ttsAborts = {};          // seq -> { controller, replyId }
  var ttsNextSeq = 0;
  var ttsNextPlaySeq = 0;
  var ttsSkipped = {};         // 合成失败/取消的序号，防止后续段被它阻塞
  var ttsCurrent = null;
  var ttsFailedReplies = {};
  var ttsDiscardUntilDone = false; // 新消息/切会话时，不让旧回合的迟到 token 开始朗读
  var ttsAudio = new Audio();  // 复用单个播放器，确保关闭可立即停止

  function updateTtsButton() {
    ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
    ttsBtn.title = ttsEnabled ? '关闭自动朗读并停止播放' : '开启自动朗读';
    ttsBtn.setAttribute('aria-label', ttsBtn.title);
    ttsBtn.setAttribute('aria-pressed', ttsEnabled ? 'true' : 'false');
    ttsBtn.classList.toggle('enabled', ttsEnabled);
  }

  function revokePrepared() {
    Object.keys(ttsPrepared).forEach(function (seq) {
      if (ttsPrepared[seq].url) URL.revokeObjectURL(ttsPrepared[seq].url);
    });
    ttsPrepared = {};
  }

  function stopTts() {
    ttsGeneration += 1;
    Object.keys(ttsAborts).forEach(function (seq) { ttsAborts[seq].controller.abort(); });
    ttsAborts = {};
    ttsInFlight = 0;
    ttsQueue = [];
    revokePrepared();
    ttsSkipped = {};
    ttsNextSeq = 0;
    ttsNextPlaySeq = 0;
    ttsFailedReplies = {};
    if (ttsCurrent && ttsCurrent.url) URL.revokeObjectURL(ttsCurrent.url);
    ttsCurrent = null;
    ttsAudio.onended = null;
    ttsAudio.onerror = null;
    ttsAudio.pause();
    ttsAudio.currentTime = 0;
    ttsAudio.removeAttribute('src');
    ttsAudio.load();
  }

  function stopTtsForTransition() {
    // 同会话的新消息会排队，旧 Agent 回合仍可能继续推 token；在它的 done 前静音。
    if (cur) ttsDiscardUntilDone = true;
    stopTts();
  }

  function failTtsReply(replyId, err) {
    // 单段失败只放弃本次 Agent 回复的剩余朗读；聊天和开关均不受影响。
    ttsFailedReplies[replyId] = true;
    ttsQueue = ttsQueue.filter(function (item) {
      if (item.replyId === replyId) { ttsSkipped[item.seq] = true; return false; }
      return true;
    });
    Object.keys(ttsPrepared).forEach(function (seq) {
      var item = ttsPrepared[seq];
      if (item.replyId === replyId) {
        ttsSkipped[item.seq] = true;
        URL.revokeObjectURL(item.url);
        delete ttsPrepared[seq];
      }
    });
    Object.keys(ttsAborts).forEach(function (seq) {
      var pending = ttsAborts[seq];
      if (pending.replyId === replyId) {
        ttsSkipped[Number(seq)] = true;
        pending.controller.abort();
      }
    });
    console.warn('TTS 分段失败，已跳过本轮剩余朗读：', err);
  }

  function playNextTts() {
    if (ttsCurrent || !ttsEnabled) return;
    while (ttsSkipped[ttsNextPlaySeq]) {
      delete ttsSkipped[ttsNextPlaySeq];
      ttsNextPlaySeq += 1;
    }
    var item = ttsPrepared[ttsNextPlaySeq];
    if (!item) return; // 等待较早的并发请求，严格按文本先后播放
    delete ttsPrepared[ttsNextPlaySeq];
    ttsNextPlaySeq += 1;
    if (ttsFailedReplies[item.replyId]) { URL.revokeObjectURL(item.url); pumpTts(); return; }
    ttsCurrent = item;
    ttsAudio.onended = function () {
      if (ttsCurrent === item) {
        URL.revokeObjectURL(item.url);
        ttsCurrent = null;
        pumpTts();
      }
    };
    ttsAudio.onerror = function () {
      if (ttsCurrent === item) {
        URL.revokeObjectURL(item.url);
        ttsCurrent = null;
        failTtsReply(item.replyId, 'audio playback error');
        pumpTts();
      }
    };
    ttsAudio.src = item.url;
    ttsAudio.play().catch(function (err) {
      // 自动播放策略、设备错误等都只能降级，绝不能影响聊天。
      if (ttsCurrent === item) {
        URL.revokeObjectURL(item.url);
        ttsCurrent = null;
        failTtsReply(item.replyId, err);
        pumpTts();
      }
    });
    // 当前段播放期间立即预合成下一段，降低句间停顿。
    pumpTts();
  }

  function startTtsSynthesis(item) {
    var generation = ttsGeneration;
    var controller = new AbortController();
    ttsInFlight += 1;
    ttsAborts[item.seq] = { controller: controller, replyId: item.replyId };
    fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: item.text }),
        signal: controller.signal
    }).then(function (response) {
        if (!response.ok) throw new Error('TTS 请求失败（' + response.status + '）');
        return response.blob();
    }).then(function (blob) {
        if (!ttsEnabled || generation !== ttsGeneration || ttsFailedReplies[item.replyId]) return;
        if (!blob.size) throw new Error('TTS 返回了空音频');
        ttsPrepared[item.seq] = { replyId: item.replyId, url: URL.createObjectURL(blob) };
    }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        if (generation === ttsGeneration) {
          ttsSkipped[item.seq] = true;
          failTtsReply(item.replyId, err);
        }
    }).finally(function () {
        if (generation !== ttsGeneration) return;
        delete ttsAborts[item.seq];
        ttsInFlight = Math.max(0, ttsInFlight - 1);
        pumpTts();
    });
  }

  function pumpTts() {
    if (!ttsEnabled) return;
    playNextTts();
    // 在途请求 + 已就绪音频合计最多两段，避免播放赶不上合成时 Blob 无界增长。
    while (ttsInFlight < 2 && (ttsInFlight + Object.keys(ttsPrepared).length) < 2 && ttsQueue.length) {
      var item = ttsQueue.shift();
      if (ttsFailedReplies[item.replyId]) { ttsSkipped[item.seq] = true; continue; }
      startTtsSynthesis(item);
    }
    playNextTts();
  }

  function enqueueTts(text, replyId) {
    text = (text || '').trim();
    if (!text || !ttsEnabled || ttsFailedReplies[replyId]) return;
    // 同时最多积压三段待合成文本；极端高速输出时合并末段，不丢正文。
    if (ttsQueue.length >= 3) ttsQueue[ttsQueue.length - 1].text += ' ' + text;
    else ttsQueue.push({ text: text, replyId: replyId, seq: ttsNextSeq++ });
    pumpTts();
  }

  function isStrongTtsBoundary(ch) {
    return /[。！？!?；;]/.test(ch) || ch === String.fromCharCode(10);
  }

  function findTtsBoundary(buf, limit, minLength) {
    var strong = -1;
    var weak = -1;
    for (var i = 0; i < Math.min(buf.length, limit); i++) {
      var n = i + 1;
      if (n < minLength) continue;
      var ch = buf.charAt(i);
      if (isStrongTtsBoundary(ch)) strong = n;
      else if (/[，,：:]/.test(ch)) weak = n;
    }
    // 完整句末优先于逗号等弱边界；都没有时由调用方决定是否硬切。
    return strong >= 0 ? strong : weak;
  }

  function chooseTtsCut(turn, buf) {
    var firstSegment = turn.ttsSegmentCount === 0;
    if (firstSegment) {
      // 第一完整句尽快开口，降低首段等待；短语/逗号仍继续累计。
      for (var i = 0; i < buf.length; i++) {
        if (i + 1 >= 8 && isStrongTtsBoundary(buf.charAt(i))) return i + 1;
      }
    } else {
      // 后续把多个短句合成较自然的段落，再在完整句末切开。
      for (var j = 39; j < buf.length; j++) {
        if (isStrongTtsBoundary(buf.charAt(j))) return j + 1;
      }
    }

    // 首段没有句号时可在较长分句处启动；后续逗号只作长文本回退。
    var fallbackAt = firstSegment ? 32 : 80;
    var fallbackMin = firstSegment ? 16 : 40;
    if (buf.length >= fallbackAt) {
      var longBoundary = findTtsBoundary(buf, fallbackAt, fallbackMin);
      if (longBoundary >= 0) return longBoundary;
    }
    // 无标点文本只在达到较高上限时切开；仍优先选择完整句或分句边界。
    var hardLimit = firstSegment ? 64 : 120;
    if (buf.length >= hardLimit) {
      var safeBoundary = findTtsBoundary(buf, hardLimit, fallbackMin);
      return safeBoundary >= 0 ? safeBoundary : hardLimit;
    }
    return -1;
  }

  function flushTtsSegments(turn, force) {
    if (ttsDiscardUntilDone || !turn.ttsEligible || turn.ttsGeneration !== ttsGeneration || !ttsEnabled) return;
    var buf = turn.ttsBuffer || '';
    while (buf) {
      var cut = chooseTtsCut(turn, buf);
      if (cut < 0) {
        if (force) { enqueueTts(buf, turn.ttsReplyId); buf = ''; }
        break;
      }
      enqueueTts(buf.slice(0, cut), turn.ttsReplyId);
      turn.ttsSegmentCount += 1;
      buf = buf.slice(cut);
    }
    turn.ttsBuffer = buf;
  }

  function collectTtsToken(turn, text) {
    if (ttsDiscardUntilDone || !turn.ttsEligible || turn.ttsGeneration !== ttsGeneration || !ttsEnabled) return;
    turn.ttsBuffer += (text || '');
    flushTtsSegments(turn, false);
  }

  ttsBtn.onclick = function () {
    if (ttsEnabled) {
      ttsEnabled = false;
      stopTts();
    } else {
      ttsEnabled = true;
    }
    updateTtsButton();
  };
  updateTtsButton();

  function addUser(text, imgUrls) {
    var m = document.createElement('div'); m.className = 'msg user';
    if (text) {
      var b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
      m.appendChild(b);
    }
    if (imgUrls && imgUrls.length) {
      var strip = document.createElement('div'); strip.className = 'img-strip';
      imgUrls.forEach(function (u) {
        var im = document.createElement('img'); im.src = u; im.loading = 'lazy';
        strip.appendChild(im);
      });
      m.appendChild(strip);
    }
    chat.appendChild(m); scrollChatToBottom();
  }
  function addSys(text) {
    var m = document.createElement('div'); m.className = 'msg sys'; m.textContent = text;
    chat.appendChild(m); scrollChatToBottom();
  }

  // —— 一个 bot 回合 = 思考面板(默认折叠) + 工具活动(默认折叠) + 正式回答 ——
  var cur = null;
  function newTurn() {
    var root = document.createElement('div'); root.className = 'msg bot';

    // 思考面板：默认折叠 (collapsed)，标题行展示「单行预览 + 思考时长」
    var think = document.createElement('div'); think.className = 'think live collapsed';
    think.innerHTML = '<div class="sum"><span class="sum-label">💭 思考过程</span>'
                    + '<span class="sum-preview"></span>'
                    + '<span class="sum-dur"></span></div>'
                    + '<div class="think-body"></div>';

    var activity = document.createElement('div'); activity.className = 'activity';
    var subagents = document.createElement('div'); subagents.className = 'subagents';

    // 机器人回合内联图片条（生图工具 generate_image 的 image 事件会往这里塞 <img>）
    var botImages = document.createElement('div'); botImages.className = 'img-strip bot-images';

    var ansWrap = document.createElement('div'); ansWrap.className = 'answer-wrap';
    ansWrap.innerHTML = '<div class="answer-label">正式回答</div><div class="answer empty"></div>';
    var answer = ansWrap.querySelector('.answer');

    root.appendChild(think);
    root.appendChild(activity);
    root.appendChild(subagents);
    root.appendChild(botImages);
    root.appendChild(ansWrap);
    chat.appendChild(root); scrollChatToBottom();
    return { root: root, think: think,
             thinkBody: think.querySelector('.think-body'),
             thinkPreview: think.querySelector('.sum-preview'),
             thinkDur: think.querySelector('.sum-dur'),
             activity: activity, subagents: subagents, subagentRuns: {}, botImages: botImages, answer: answer,
             answerStarted: false, lastTool: null,
             ttsEligible: ttsEnabled, ttsGeneration: ttsGeneration,
             ttsReplyId: ++ttsReplySeq, ttsBuffer: '', ttsSegmentCount: 0,
             thinkStart: performance.now(), thinkEnded: false };
  }

  // —— 思考时长：从回合开始到「正式回答首次出现」的耗时（含工具调用）——
  function fmtDur(ms) { return ' · ' + (ms / 1000).toFixed(1) + 's'; }
  function finishThink(c) {
    if (c.thinkEnded) return;
    c.thinkEnded = true;
    if (!c.thinkBody.textContent.trim()) {
      c.thinkPreview.textContent = '（模型未返回思考内容）';
    }
    c.thinkDur.textContent = fmtDur(performance.now() - c.thinkStart);
  }

  function subagentLabel(depth) {
    return depth > 0 ? ('第 ' + depth + ' 层') : '子 Agent';
  }
  function newSubagentPanel(turn, run) {
    var runId = String(run.run_id || run.id || ('history-' + Object.keys(turn.subagentRuns).length));
    if (turn.subagentRuns[runId]) return turn.subagentRuns[runId];
    var depth = Number(run.depth || 0);
    var root = document.createElement('div'); root.className = 'subagent live';
    // 仅作轻量视觉层级，不让异常 depth 把面板推到屏幕外。
    root.style.marginLeft = (Math.min(Math.max(depth, 0), 4) * 12) + 'px';
    root.innerHTML = '<div class="sa-head"><span class="sa-name"></span><span class="sa-depth"></span>'
                   + '<span class="sa-status">⏳ 运行中</span><span class="sa-dur"></span></div>'
                   + '<div class="sa-body"><div class="sa-output"></div><div class="sa-tools"></div></div>';
    root.querySelector('.sa-name').textContent = '🤖 ' + (run.agent_name || run.name || '子 Agent');
    root.querySelector('.sa-depth').textContent = subagentLabel(depth);
    turn.subagents.appendChild(root);
    var panel = { id: runId, root: root, output: root.querySelector('.sa-output'), tools: root.querySelector('.sa-tools'),
                  status: root.querySelector('.sa-status'), dur: root.querySelector('.sa-dur'), lastTool: null,
                  start: performance.now(), ended: false };
    panel.timer = setInterval(function () {
      if (!panel.ended) panel.dur.textContent = fmtDur(performance.now() - panel.start);
    }, 100);
    turn.subagentRuns[runId] = panel;
    return panel;
  }
  function appendSubagentTool(panel, ev) {
    var card = document.createElement('div'); card.className = 'tool-card';
    card.innerHTML = '<div class="tc-head"><span class="tc-name"></span><span class="tc-status">⏳ 执行中</span><span class="tc-dur"></span></div>'
                   + '<div class="tc-args"></div><div class="tc-result"></div>';
    card.querySelector('.tc-name').textContent = '🔧 ' + (ev.name || '工具');
    card.querySelector('.tc-args').textContent = ev.args != null ? String(ev.args) : '';
    card._start = performance.now();
    card._timer = setInterval(function () { card.querySelector('.tc-dur').textContent = fmtDur(performance.now() - card._start); }, 100);
    panel.tools.appendChild(card); panel.lastTool = card;
    return card;
  }
  function finishSubagentTool(card, ev) {
    if (!card) return;
    if (card._timer) { clearInterval(card._timer); card._timer = null; }
    card.classList.add('has-result');
    card.querySelector('.tc-result').textContent = ev.content != null ? String(ev.content) : '';
    var ms = typeof ev.duration_ms === 'number' ? ev.duration_ms : performance.now() - card._start;
    card.querySelector('.tc-dur').textContent = fmtDur(ms);
    var toolStatus = String(ev.status || (ev.error ? 'error' : 'completed')).toLowerCase();
    if (toolStatus === 'running') card.querySelector('.tc-status').textContent = '⏳ 执行中';
    else if (toolStatus === 'timed_out' || toolStatus === 'timeout') card.querySelector('.tc-status').textContent = '⏱ 超时';
    else if (toolStatus === 'cancelled' || toolStatus === 'canceled') card.querySelector('.tc-status').textContent = '⚪ 已取消';
    else if (toolStatus === 'error' || toolStatus === 'failed' || ev.error) card.querySelector('.tc-status').textContent = '❌ 失败';
    else card.querySelector('.tc-status').textContent = '✅ 完成';
  }
  function finishSubagentPanel(panel, ev) {
    if (panel.ended) return;
    panel.ended = true;
    if (panel.timer) { clearInterval(panel.timer); panel.timer = null; }
    panel.tools.querySelectorAll('.tool-card').forEach(function (card) {
      if (card._timer) { clearInterval(card._timer); card._timer = null; }
    });
    panel.root.classList.remove('live');
    var ms = typeof ev.duration_ms === 'number' ? ev.duration_ms : performance.now() - panel.start;
    panel.dur.textContent = fmtDur(ms);
    var status = String(ev.status || (ev.type === 'error' ? 'error' : '')).toLowerCase();
    if (status === 'success' || status === 'succeeded' || status === 'completed' || (!status && ev.ok !== false)) {
      panel.status.textContent = '✅ 成功';
    } else if (status === 'timed_out' || status === 'timeout') {
      panel.status.textContent = '⏱ 超时';
    } else if (status === 'cancelled' || status === 'canceled') {
      panel.status.textContent = '⚪ 已取消';
    } else if (status === 'error' || status === 'failed' || ev.ok === false) {
      panel.status.textContent = '❌ 失败';
    } else {
      panel.status.textContent = '⚠ 已结束';
    }
    // 后端终态会携带 final_result，但流式 token 往往已经显示过相同内容。
    var finalContent = ev.content != null ? String(ev.content) : '';
    if (finalContent && panel.output.textContent.indexOf(finalContent) === -1) {
      panel.output.textContent += (panel.output.textContent ? '\n' : '') + finalContent;
    }
  }
  function onSubagentEvent(turn, wrapped) {
    var ev = wrapped.event || {};
    if (typeof ev === 'string') ev = { type: ev, content: wrapped.content };
    var panel = newSubagentPanel(turn, wrapped);
    var type = ev.type || ev.event || 'thinking';
    if (type === 'start') {
      if (ev.content) panel.output.textContent += String(ev.content);
    } else if (type === 'thinking' || type === 'token') {
      // 子 Agent 的 token 只显示在此面板，绝不能进入父答案或 TTS。
      panel.output.textContent += String(ev.content || '');
    } else if (type === 'tool_call') {
      appendSubagentTool(panel, ev);
    } else if (type === 'tool_result') {
      finishSubagentTool(panel.lastTool, ev);
    } else if (type === 'image') {
      // 图片归属仍由 generated_images 统一持久化；这里只做实时预览。
      var im = document.createElement('img');
      im.src = ev.url || ('/image?key=' + encodeURIComponent(currentKey) + '&id=' + encodeURIComponent(ev.id || ''));
      im.loading = 'lazy'; turn.botImages.appendChild(im);
    } else if (type === 'done' || type === 'error') {
      finishSubagentPanel(panel, ev);
    }
    scrollChatToBottom();
  }
  function clearSubagentTimers(turn) {
    if (!turn || !turn.subagentRuns) return;
    Object.keys(turn.subagentRuns).forEach(function (id) {
      var panel = turn.subagentRuns[id];
      if (panel.timer) { clearInterval(panel.timer); panel.timer = null; }
      panel.tools.querySelectorAll('.tool-card').forEach(function (card) {
        if (card._timer) { clearInterval(card._timer); card._timer = null; }
      });
      if (!panel.ended) {
        panel.ended = true;
        panel.root.classList.remove('live');
        panel.status.textContent = '⚠ 已结束';
        panel.dur.textContent = fmtDur(performance.now() - panel.start);
      }
    });
  }

  function onEvent(ev) {
    // 版本握手：若服务端页面版本与本地不一致，说明本地是过期缓存页，
    // 立即强制刷新拉取最新前端（自愈，避免旧页面把 {"event":...} 当文本贴出）
    if (ev.type === 'hello') {
      var pv = (document.querySelector('meta[name=page-version]') || {}).content;
      if (pv && ev.version && pv !== ev.version) {
        console.warn('检测到前端版本过期，自动刷新以加载最新页面…');
        location.reload(true);
      }
      return;
    }
    // 会话切换/新建后，后端回传当前会话标识，前端同步高亮
    if (ev.type === 'session_changed') {
      stopTtsForTransition();
      currentKey = ev.key;
      loadSessions();
      return;
    }
    var t = ev.type;
    if (t === 'subagent_event') {
      if (!cur) { cur = newTurn(); updateSendBtn(); }
      onSubagentEvent(cur, ev);
      return;
    }
    if (!cur) { cur = newTurn(); updateSendBtn(); }
    if (t === 'thinking') {
      // 全文累积到 body（仅展开时可见），单行预览随思考流式刷新
      cur.thinkBody.textContent += (ev.content || '');
      cur.thinkPreview.textContent = cur.thinkBody.textContent;
      scrollChatToBottom();
    } else if (t === 'token') {
      if (!cur.answerStarted) {
        cur.answer.classList.remove('empty'); cur.answer.textContent = ''; cur.answerStarted = true;
        finishThink(cur);   // 正式回答开始 = 思考结束，记录思考时长
      }
      cur.answer.textContent += (ev.content || '');
      collectTtsToken(cur, ev.content || '');
      scrollChatToBottom();
    } else if (t === 'tool_call') {
      // 工具卡片默认折叠：标题只显示「名称 + 状态」，点开才看入参/出参
      var card = document.createElement('div'); card.className = 'tool-card';
      card.innerHTML = '<div class="tc-head"><span class="tc-name"></span>'
                     + '<span class="tc-status">⏳ 执行中</span>'
                     + '<span class="tc-dur"></span></div>'
                     + '<div class="tc-args"></div><div class="tc-result"></div>';
      card.querySelector('.tc-name').textContent = '🔧 ' + (ev.name || '');
      card.querySelector('.tc-args').textContent = (ev.args != null ? ev.args : '');
      cur.activity.appendChild(card); cur.lastTool = card;
      // 走动的计时：执行中实时刷新耗时，完成后由 tool_result 停表并结算
      card._start = performance.now();
      card._timer = setInterval(function () {
        card.querySelector('.tc-dur').textContent = fmtDur(performance.now() - card._start);
      }, 100);
      scrollChatToBottom();
    } else if (t === 'tool_result') {
      var card2 = cur.lastTool;
      if (card2) {
        if (card2._timer) { clearInterval(card2._timer); card2._timer = null; }
        card2.classList.add('has-result');
        card2.querySelector('.tc-result').textContent = (ev.content || '');
        // 优先用后端精确时长；兜底用前端本地计时（异常断流未回传 duration_ms 时也能显示）
        var durMs = (typeof ev.duration_ms === 'number') ? ev.duration_ms
                  : (typeof card2._start === 'number' ? (performance.now() - card2._start) : null);
        card2.querySelector('.tc-dur').textContent = (durMs != null) ? fmtDur(durMs) : '';
        card2.querySelector('.tc-status').textContent = '✅ 完成';
      }
      scrollChatToBottom();
    } else if (t === 'image') {
      // 生图工具 generate_image 内联图片：把 <img> 塞进当前回合的图片条
      var iu = ev.url || ('/image?key=' + encodeURIComponent(currentKey)
                + '&id=' + encodeURIComponent(ev.id || ''));
      var im = document.createElement('img');
      im.src = iu; im.loading = 'lazy';
      cur.botImages.appendChild(im);
      scrollChatToBottom();
    } else if (t === 'done') {
      var wasStopping = stopping;   // 记录是否因用户点「停止」而结束
      // 兜底：清理任何残留的工具计时器（如某工具异常未回传 tool_result）
      if (cur.activity) cur.activity.querySelectorAll('.tool-card').forEach(function (tc) {
        if (tc._timer) { clearInterval(tc._timer); tc._timer = null; }
      });
      clearSubagentTimers(cur);
      cur.think.classList.remove('live');
      finishThink(cur);   // 兜底：无论是否出 token，回合结束都记录思考时长
      if (!cur.answerStarted && ev.content) {
        cur.answer.classList.remove('empty');
        cur.answer.textContent = ev.content;
        cur.answerStarted = true;
        // 兼容未逐 token 推送、仅在 done 给出完整正文的 Provider；不会与流式正文重复。
        collectTtsToken(cur, ev.content);
      } else if (wasStopping && cur.answerStarted && ev.content) {
        // 用户点击「停止」且已有部分回答：保留已生成内容，末尾追加停止标记
        cur.answer.textContent += '\n' + ev.content;
      }
      if (!cur.answer.textContent.trim()) cur.answer.textContent = '（本轮未生成正式回答）';
      // token 已增量分句；done 只清空尾部，避免把完整 content 重复朗读。
      flushTtsSegments(cur, true);
      ttsDiscardUntilDone = false;
      cur = null;
      updateSendBtn();   // 回合结束：按钮恢复「发送」
      scrollChatToBottom();
      loadSessions();   // 刷新侧边栏：新会话出现 / 预览与末次时间更新
    }
  }
  // 点标题折叠/展开：思考面板 (.sum)、子 Agent (.sa-head) 与工具卡片 (.tc-head)
  chat.addEventListener('click', function (e) {
    var tgt = e.target;
    if (!tgt || !tgt.classList || !tgt.closest) return;
    var sumEl = tgt.closest('.sum');
    if (sumEl) { sumEl.parentNode.classList.toggle('collapsed'); return; }
    var subagentHead = tgt.closest('.sa-head');
    if (subagentHead) { subagentHead.parentNode.classList.toggle('expanded'); return; }
    var head = tgt.closest('.tc-head');
    if (head) { head.parentNode.classList.toggle('expanded'); }
  });

  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  var ws = null;                 // 当前 WebSocket（断线后重建）
  var _reconnectDelay = 1000;    // 重连间隔（指数退避，上限 10s）
  var _reconnectTimer = null;

  // 建立 WebSocket；断线后自动重连（指数退避），连上后自动接回当前会话。
  // 解决：Mac 睡眠 / 重启实例后，浏览器旧连接死掉、一直「已断开」需手动刷新的问题。
  function connectWS() {
    ws = new WebSocket(proto + '://' + location.host + '/ws');
    ws.onopen = function () {
      statusEl.textContent = '已连接';
      statusEl.style.color = 'var(--ok)';
      _reconnectDelay = 1000;           // 连接成功，重置退避
      // 若之前有激活会话，重连后自动接回（服务端新连接会重置会话，需要重新 open）
      if (currentKey) {
        ws.send(JSON.stringify({ ctl: true, type: 'open', key: currentKey }));
      }
      loadSessions();                   // 顺手刷新侧边栏列表
    };
    ws.onclose = function () {
      // 旧连接不会再送达 done；直接废弃其回合，避免“静音到 done”状态污染重连后的首条回复。
      stopTts();
      ttsDiscardUntilDone = false;
      clearSubagentTimers(cur);
      cur = null;
      updateSendBtn();   // 断线回合作废：按钮恢复「发送」
      statusEl.textContent = '已断开 · 重连中…';
      statusEl.style.color = '#d98c00';
      if (_reconnectTimer) clearTimeout(_reconnectTimer);
      _reconnectTimer = setTimeout(connectWS, _reconnectDelay);
      _reconnectDelay = Math.min(Math.floor(_reconnectDelay * 1.6), 10000);
    };
    ws.onerror = function () {
      statusEl.textContent = '连接错误 · 重连中…';
      statusEl.style.color = '#d98c00';
    };
    ws.onmessage = function (e) {
      var data = e.data;
      // 优先按流式事件 JSON 解析：{"event": {...}}
      if (data && data.charAt(0) === '{') {
        try {
          var obj = JSON.parse(data);
          if (obj && obj.event) { onEvent(obj.event); return; }
        } catch (err) { /* 不是预期 JSON */ }
        // 防御：非事件帧不渲染为文本（避免出现「一堆 JSON」），仅在控制台记录
        console.warn('收到非事件帧，已忽略：', data.slice(0, 200));
        return;
      }
      // 兜底：纯文本（/new 等命令回复）—— 开一个独立回合显示
      if (!cur) cur = newTurn();
      if (!cur.answerStarted) { cur.answer.classList.remove('empty'); cur.answer.textContent = ''; cur.answerStarted = true; }
      cur.answer.textContent += data;
      cur.think.classList.remove('live');
      cur = null;
      updateSendBtn();   // 兜底路径也要恢复按钮
    };
  }
  connectWS();

  // —— 图片附件：粘贴或选择后先本地暂存（File + ObjectURL 预览），发送时才上传 ——
  // 发送时才上传的原因：上传接口按「当前会话 key」落盘，若附图后又切换会话，
  // 提前上传的图会落错目录；发送瞬间 currentKey 一定是本条消息所属会话。
  var attachBar = document.getElementById('attach');
  var fileInput = document.getElementById('fileInput');
  var recordBtn = document.getElementById('recordBtn');
  var pendingImages = [];   // [{file, url}]

  function renderAttach() {
    attachBar.innerHTML = '';
    attachBar.className = pendingImages.length ? 'show' : '';
    pendingImages.forEach(function (it, idx) {
      var d = document.createElement('div'); d.className = 'att-item';
      var im = document.createElement('img'); im.src = it.url; d.appendChild(im);
      var del = document.createElement('button'); del.className = 'att-del'; del.textContent = '✕';
      del.title = '移除这张图';
      del.onclick = function () {
        URL.revokeObjectURL(it.url);
        pendingImages.splice(idx, 1);
        renderAttach();
      };
      d.appendChild(del);
      attachBar.appendChild(d);
    });
  }
  function addPendingFile(file) {
    if (!file || file.type.indexOf('image/') !== 0) return;
    pendingImages.push({ file: file, url: URL.createObjectURL(file) });
    renderAttach();
  }
  // 入口 1：按钮选择文件（可多选）
  document.getElementById('attachBtn').onclick = function () { fileInput.click(); };
  fileInput.addEventListener('change', function () {
    Array.prototype.forEach.call(fileInput.files || [], addPendingFile);
    fileInput.value = '';   // 允许再次选择同一文件
  });
  // 入口 2：在输入框（或页面任意处）粘贴剪贴板图片
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var got = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { addPendingFile(f); got = true; }
      }
    }
    if (got) e.preventDefault();   // 有图片时不把二进制粘进输入框
  });
  // 入口 3：拖拽图片到聊天区
  chat.addEventListener('dragover', function (e) { e.preventDefault(); });
  chat.addEventListener('drop', function (e) {
    e.preventDefault();
    Array.prototype.forEach.call((e.dataTransfer && e.dataTransfer.files) || [], addPendingFile);
  });

  function uploadOne(file, key) {
    var fd = new FormData();
    fd.append('file', file, file.name || 'pasted.png');
    return fetch('/upload?key=' + encodeURIComponent(key), { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error) || '上传失败');
        return d.image_id;
      });
  }

  // —— 停止键：回合进行中 sendBtn 变「⏹ 停止」，点击后取消当前回合 ——
  var stopping = false;          // 停止请求已发出（防重复点击）
  var stopRetryTimer = null;     // 兜底：done 迟迟未到则恢复可点击，允许重试

  function updateSendBtn() {
    if (stopRetryTimer) { clearTimeout(stopRetryTimer); stopRetryTimer = null; }
    if (cur) {
      sendBtn.textContent = '⏹ 停止';
      sendBtn.classList.add('stop');
      sendBtn.disabled = stopping;
    } else {
      sendBtn.textContent = '发送';
      sendBtn.classList.remove('stop');
      sendBtn.disabled = false;
      stopping = false;
    }
  }

  function stopTurn() {
    if (!cur || stopping) return;
    stopping = true;
    updateSendBtn();
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      // 连接已断开：本地直接结束回合状态（已生成内容保留在界面）
      cur = null;
      updateSendBtn();
      return;
    }
    try {
      ws.send(JSON.stringify({ ctl: true, type: 'cancel' }));
    } catch (err) {
      stopping = false;
      updateSendBtn();
      return;
    }
    // 防抖兜底：8s 内未收到 done（服务端异常/取消未生效）则恢复可点击以便重试
    stopRetryTimer = setTimeout(function () {
      stopRetryTimer = null;
      stopping = false;
      updateSendBtn();
    }, 8000);
  }

  var sending = false;   // 上传期间防重复发送
  function send() {
    if (recorder || recordingBusy) {
      addSys(recorder ? '正在录音，请先停止录音。' : '正在转写语音，请稍候。');
      return;
    }
    if (sending) return;
    var text = input.value.trim();
    var hasImgs = pendingImages.length > 0;
    if ((!text && !hasImgs) || ws.readyState !== WebSocket.OPEN) return;

    if (!hasImgs) {          // 纯文本：维持原路径（命令等均不受影响）
      stopTtsForTransition();
      addUser(text);
      cur = newTurn();
      updateSendBtn();   // 回合开始：按钮变「⏹ 停止」
      ws.send(text);
      input.value = '';
      return;
    }
    // 带图片：需要当前会话 key；连接建立/切换会话时后端会推 session_changed
    if (!currentKey) { addSys('会话尚未就绪，请稍候再发送图片'); return; }
    sending = true;
    var imgs = pendingImages.slice();
    var key = currentKey;
    statusEl.textContent = '上传图片中…';
    Promise.all(imgs.map(function (it) { return uploadOne(it.file, key); }))
      .then(function (ids) {
        stopTtsForTransition();
        addUser(text, imgs.map(function (it) { return it.url; }));   // 本地预览 URL 直接回显
        cur = newTurn();
        updateSendBtn();   // 回合开始：按钮变「⏹ 停止」
        ws.send(JSON.stringify({ text: text, images: ids }));
        input.value = '';
        pendingImages = [];
        renderAttach();
        statusEl.textContent = '已连接';
      })
      .catch(function (e) {
        addSys('图片上传失败：' + (e && e.message || e) + '，本条消息未发送');
        statusEl.textContent = '已连接';
      })
      .finally(function () { sending = false; });
  }
  sendBtn.onclick = function () {
    if (cur) { stopTurn(); return; }   // 回合进行中：按钮是「停止」
    send();
  };
  // 回车发送；但输入法（IME）组字过程中的回车（确认候选词）不算发送，
  // 用 isComposing / keyCode===229 区分，避免中文上屏误发。
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) send();
  });

  // —— 浏览器录音：仅把 ASR 成功的文本交给现有 WebSocket 文本入口 ——
  var recorder = null;
  var recordingStream = null;
  var recordingChunks = [];
  var recordingBusy = false;
  var recordingSessionKey = null;

  function stopRecordingTracks() {
    if (recordingStream) {
      recordingStream.getTracks().forEach(function (track) { track.stop(); });
      recordingStream = null;
    }
  }

  function setRecordingState(active, busy) {
    recordingBusy = !!busy;
    recordBtn.disabled = !!busy;
    recordBtn.classList.toggle('recording', !!active);
    recordBtn.textContent = active ? '■' : '🎙';
    recordBtn.title = active ? '停止录音' : (busy ? '语音转写中…' : '开始录音');
  }

  function canChangeSession() {
    if (!recorder && !recordingBusy) return true;
    addSys(recorder ? '正在录音，请先停止录音。' : '正在转写语音，请稍候。');
    return false;
  }

  function chooseRecorderOptions() {
    if (!window.MediaRecorder) return null;
    var types = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < types.length; i++) {
      if (!MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(types[i])) {
        return { mimeType: types[i] };
      }
    }
    return {};
  }

  function uploadRecording(blob, filename) {
    var fd = new FormData();
    fd.append('file', blob, filename);
    return fetch('/api/asr', { method: 'POST', body: fd })
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          if (!response.ok || !body.ok) {
            var err = body && body.error;
            throw new Error((err && err.message) || '语音转写失败');
          }
          return String(body.text || '').trim();
        });
      });
  }

  function startRecording() {
    if (recordingBusy || recorder) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      addSys('当前浏览器不支持录音，请使用安全上下文（HTTPS 或 localhost）并换用现代浏览器。');
      return;
    }
    if (!window.isSecureContext && location.hostname !== 'localhost') {
      addSys('录音需要安全上下文：请使用 HTTPS 或 localhost 访问此页面。');
      return;
    }
    // 即使 UI 已阻止切换，会话也可能因重连/服务端事件变化；完成转写前必须
    // 仍属于开始录音时的同一会话，才允许走现有文本发送路径。
    recordingSessionKey = currentKey;
    setRecordingState(false, true);
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recordingStream = stream;
      recordingChunks = [];
      var options = chooseRecorderOptions();
      recorder = options ? new MediaRecorder(stream, options) : new MediaRecorder(stream);
      recorder.ondataavailable = function (event) {
        if (event.data && event.data.size) recordingChunks.push(event.data);
      };
      recorder.onerror = function () {
        addSys('录音发生错误，请检查麦克风后重试。');
        recorder = null;
        stopRecordingTracks();
        recordingSessionKey = null;
        setRecordingState(false, false);
      };
      recorder.onstop = function () {
        var finished = recorder;
        recorder = null;
        stopRecordingTracks();
        var mime = (finished && finished.mimeType) || 'audio/webm';
        var blob = new Blob(recordingChunks, { type: mime });
        recordingChunks = [];
        if (!blob.size) {
          addSys('没有录到声音，请检查麦克风权限后重试。');
          recordingSessionKey = null;
          setRecordingState(false, false);
          return;
        }
        var ext = mime.indexOf('mp4') >= 0 ? 'm4a' : (mime.indexOf('ogg') >= 0 ? 'ogg' : 'webm');
        uploadRecording(blob, 'recording.' + ext).then(function (text) {
          if (!text) throw new Error('没有识别到可发送的文字，请重新录制。');
          if (!ws || ws.readyState !== WebSocket.OPEN) throw new Error('连接未就绪，未发送转写文本。');
          if (currentKey !== recordingSessionKey) throw new Error('会话已变化，未发送转写文本。');
          stopTtsForTransition();
          addUser(text);
          cur = newTurn();
          updateSendBtn();   // 回合开始：按钮变「⏹ 停止」
          ws.send(text);
        }).catch(function (err) {
          addSys('语音转写失败：' + ((err && err.message) || err));
        }).finally(function () {
          recordingSessionKey = null;
          setRecordingState(false, false);
        });
      };
      recorder.start();
      setRecordingState(true, false);
    }).catch(function (err) {
      stopRecordingTracks();
      recordingSessionKey = null;
      setRecordingState(false, false);
      addSys('无法启用麦克风：' + ((err && err.message) || '请检查浏览器权限。'));
    });
  }

  recordBtn.onclick = function () {
    if (recorder && recorder.state !== 'inactive') {
      setRecordingState(false, true);
      recorder.stop();
      return;
    }
    startRecording();
  };

  cfgBtn.onclick = function () {
    cfgPanel.classList.toggle('show');
    if (cfgPanel.classList.contains('show')) loadConfig();
  };
  function loadConfig() {
    cfgMsg.textContent = '';
    fetch('/api/config').then(function (r) { return r.json(); }).then(function (d) {
      FIELDS.forEach(function (f) {
        var el = document.getElementById(f);
        if (el && d[f] != null) el.value = d[f];
      });
    }).catch(function (e) { cfgMsg.textContent = '加载失败：' + e; });
  }
  document.getElementById('reloadBtn').onclick = loadConfig;
  document.getElementById('saveBtn').onclick = function () {
    var payload = {};
    FIELDS.forEach(function (f) {
      var el = document.getElementById(f);
      if (el) payload[f] = el.value;
    });
    cfgMsg.textContent = '保存中…';
    fetch('/api/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (d) {
      cfgMsg.textContent = d.ok ? ('已保存。' + (d.note || '')) : ('失败：' + (d.error || ''));
    }).catch(function (e) { cfgMsg.textContent = '保存失败：' + e; });
  };

  // —— 会话侧边栏：列出历史网页会话，点击查看并接上，可删除（含本地文件）——
  var sbList = document.getElementById('sbList');
  var newBtn = document.getElementById('newBtn');
  var currentKey = null;   // 当前激活的会话标识（后端 current_key）

  function relTime(iso) {
    if (!iso) return '';
    var t = new Date(iso);
    if (isNaN(t.getTime())) return iso;
    var diff = (Date.now() - t.getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    var p = iso.split('T');
    return (p[0] || iso).slice(5) + ' ' + (p[1] || '').slice(0, 5);
  }

  function loadSessions() {
    fetch('/api/sessions').then(function (r) { return r.json(); }).then(function (d) {
      var items = (d && d.sessions) || [];
      sbList.innerHTML = '';
      if (!items.length) {
        var tip = document.createElement('div');
        tip.style.cssText = 'color:var(--muted);font-size:12px;padding:8px;';
        tip.textContent = '暂无历史会话。点击「＋ 新会话」开始。';
        sbList.appendChild(tip);
        return;
      }
      items.forEach(function (it) {
        var el = document.createElement('div');
        el.className = 'sb-item' + (it.key === currentKey ? ' active' : '');
        el.innerHTML = '<div class="sb-title"></div><div class="sb-preview"></div>'
                     + '<div class="sb-time"></div><button class="sb-del" title="删除会话">🗑</button>';
        el.querySelector('.sb-title').textContent = it.title || '(空会话)';
        el.querySelector('.sb-preview').textContent = it.preview || '';
        el.querySelector('.sb-time').textContent =
          relTime(it.updated_at) + (it.count ? (' · ' + it.count + ' 条') : '');
        el.addEventListener('click', function (e) {
          if (e.target.classList.contains('sb-del')) return;
          openSession(it.key);
        });
        el.querySelector('.sb-del').addEventListener('click', function (e) {
          e.stopPropagation();
          deleteSession(it.key);
        });
        sbList.appendChild(el);
      });
    }).catch(function (e) { console.warn('加载会话列表失败：', e); });
  }

  // 打开历史会话：后端切到该标识 + 前端拉取并回放历史，之后可继续对话
  function openSession(key) {
    if (!canChangeSession()) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) { addSys('连接未就绪，无法打开会话'); return; }
    stopTtsForTransition();
    clearSubagentTimers(cur);
    ws.send(JSON.stringify({ ctl: true, type: 'open', key: key }));
    fetch('/api/session?key=' + encodeURIComponent(key)).then(function (r) { return r.json(); }).then(function (d) {
      currentKey = key;
      chat.innerHTML = '';
      nearBottom = true;   // 历史回放从底部开始跟随
      cur = null;
      updateSendBtn();
      renderHistory((d && d.messages) || []);
      loadSessions();
    }).catch(function (e) { addSys('打开会话失败：' + e); });
  }

  // 新建会话：后端生成新标识，前端清屏（收到 session_changed 后高亮）
  function newSession() {
    if (!canChangeSession()) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) { addSys('连接未就绪'); return; }
    stopTtsForTransition();
    clearSubagentTimers(cur);
    ws.send(JSON.stringify({ ctl: true, type: 'new' }));
    chat.innerHTML = '';
    nearBottom = true;   // 新会话从底部开始跟随
    cur = null;
    updateSendBtn();
    currentKey = null;
  }

  // 删除会话：同时删本地 JSONL 文件；若正打开则自动新建一个
  function deleteSession(key) {
    if (!canChangeSession()) return;
    if (!confirm('确定删除该会话？本地记录也会一并删除，无法恢复。')) return;
    if (key === currentKey) stopTtsForTransition();
    fetch('/api/session?key=' + encodeURIComponent(key), { method: 'DELETE' })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.ok) {
          if (key === currentKey) { currentKey = null; newSession(); }
          loadSessions();
        } else { alert('删除失败：' + ((d && d.error) || '')); }
      }).catch(function (e) { alert('删除失败：' + e); });
  }

  function restoreSubagentRun(turn, run, fallback, toolResults) {
    run = run || {};
    var panel = newSubagentPanel(turn, {
      run_id: run.run_id || run.id || (fallback && fallback.run_id),
      agent_name: run.agent_name || run.name || (fallback && fallback.agent_name) || '子 Agent',
      depth: run.depth || (fallback && fallback.depth) || 0
    });
    var events = Array.isArray(run.events) ? run.events : [];
    events.forEach(function (event) {
      onSubagentEvent(turn, { run_id: panel.id, agent_name: run.agent_name || run.name, depth: run.depth, event: event });
    });
    // 新记录可以只保存摘要，不必保留完整流事件；照样恢复工具和最终结果。
    var toolSteps = Array.isArray(run.tool_steps) ? run.tool_steps : (Array.isArray(run.tools) ? run.tools : []);
    toolSteps.forEach(function (tool) {
      var card = appendSubagentTool(panel, tool);
      finishSubagentTool(card, tool);
    });
    // 子 Agent 完整结果本来就是父 spawn 工具的 tool 消息；优先用它，
    // run.final_result 只是为快速回放保留的有界摘要。
    var result = run.tool_call_id && toolResults ? toolResults[run.tool_call_id] : null;
    if (result == null) result = run.final_result;
    if (result == null) result = run.result;
    if (result == null) result = run.content;
    if (result != null && !events.length) panel.output.textContent = String(result);
    finishSubagentPanel(panel, {
      type: run.status === 'error' || run.error ? 'error' : 'done',
      status: run.status,
      ok: run.ok,
      content: events.length ? result : '',
      duration_ms: run.duration_ms
    });
  }
  function oldSpawnFallback(turn, call, toolResults) {
    var fn = call && call.function;
    if (!fn || fn.name !== 'spawn_subagent') return;
    var args = {};
    try { args = JSON.parse(fn.arguments || '{}') || {}; } catch (_err) { args = {}; }
    var result = toolResults[call.id];
    restoreSubagentRun(turn, {
      run_id: 'legacy-' + (call.id || Object.keys(turn.subagentRuns).length),
      agent_name: args.agent_name || args.name || '子 Agent',
      depth: 0,
      status: 'success',
      final_result: result != null ? result : '（历史记录未保存子 Agent 结果）'
    }, null, toolResults);
  }
  // 历史回放：把磁盘消息重建为聊天视图（思考折叠、正式回答展开）
  function renderHistory(records) {
    var toolResults = {};
    (records || []).forEach(function (m) {
      if (m && m.role === 'tool' && m.tool_call_id) toolResults[m.tool_call_id] = m.content || '';
    });
    (records || []).forEach(function (m) {
      var role = m.role;
      if (role === 'user') {
        // 带图片元数据的历史消息：通过 /image 端点回显缩略图
        var urls = null;
        if (m.images && m.images.length && currentKey) {
          urls = m.images.map(function (im) {
            return '/image?key=' + encodeURIComponent(currentKey) + '&id=' + encodeURIComponent(im.id || im);
          });
        }
        addUser(m.content || '', urls);
      } else if (role === 'assistant') {
        var c = newTurn();
        if (m.reasoning_content) {
          c.thinkBody.textContent = m.reasoning_content;
          c.thinkPreview.textContent = m.reasoning_content;
        }
        var txt = m.content || '';
        if (txt) {
          c.answer.classList.remove('empty'); c.answer.textContent = txt; c.answerStarted = true;
        } else if (m.tool_calls) {
          c.answer.classList.remove('empty');
          c.answer.textContent = '（该回合调用了工具，详见工具记录）';
          c.answerStarted = true;
        }
        c.think.classList.remove('live');
        finishThink(c);
        if (Array.isArray(m.subagent_runs) && m.subagent_runs.length) {
          m.subagent_runs.forEach(function (run) { restoreSubagentRun(c, run, null, toolResults); });
        } else if (Array.isArray(m.tool_calls)) {
          // 升级前没有 subagent_runs：从 spawn 的 tool_call 与对应 tool 结果复原最小面板。
          m.tool_calls.forEach(function (call) { oldSpawnFallback(c, call, toolResults); });
        }
        // 回放本轮生成的图片（generate_image 落盘 + generated_images 元数据）
        if (m.generated_images && m.generated_images.length && currentKey) {
          m.generated_images.forEach(function (iid) {
            var gim = document.createElement('img');
            gim.src = '/image?key=' + encodeURIComponent(currentKey)
                    + '&id=' + encodeURIComponent(iid);
            gim.loading = 'lazy';
            c.botImages.appendChild(gim);
          });
        }
        cur = null;
      }
      // system / tool 消息在侧边栏回放中省略（不污染主对话视图）
    });
    scrollChatToBottom();
  }

  newBtn.onclick = newSession;
  loadSessions();   // 首屏拉取历史会话列表

  addSys('欢迎使用 NanoClaw 网页端。左侧「会话」可查看并接上历史会话，也可删除；思考过程与工具调用默认折叠为单行，点标题即可展开，并显示思考时长。');
})();
</script>
