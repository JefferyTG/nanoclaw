<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小奈</title>
<meta name="page-version" content="__NC_PAGE_VERSION__" />
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e8ec; --muted:#9aa3b2; --accent:#538bf0; --ok:#3ecf8e; --think:#2a2333; --think-line:#4a3a5e; }
  * { box-sizing: border-box; }
  /* TASK-039：汉堡按钮 / 侧边栏遮罩仅移动端显示，桌面默认隐藏 */
  #sbToggle { display:none; }
  #sbMask { display:none; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:500; }
  header .status { font-size:12px; color:var(--muted); margin-left:auto; }
  header button { background:var(--panel); color:var(--txt); border:1px solid var(--line);
                  border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13px; }
  header button:hover { border-color:var(--accent); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:0; border-radius:12px; }
  .msg.user { align-self:flex-end; }
  .msg.user .bubble { background:var(--accent); color:#fff; padding:9px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.bot { align-self:flex-start; width:88%; display:flex; flex-direction:column; gap:8px; }
  .msg.sys { align-self:center; background:transparent; color:var(--muted); font-size:12px; }
  /* TASK-046：主界面「任务进行中」横幅（断线重连/长任务时显示，比侧边栏徽标更显眼） */
  #taskBanner { display:none; align-items:center; justify-content:center; gap:6px;
                padding:6px 12px; font-size:12px; color:#e0a23a; text-align:center;
                background:rgba(224,162,58,.10); border-bottom:1px solid rgba(224,162,58,.25);
                animation:sbBreath 1.6s ease-in-out infinite; }

  /* —— 思考过程面板：独立分区、默认折叠、点开看 —— */
  .think { border:1px solid var(--think-line); border-radius:10px; background:var(--think); overflow:hidden; }
  .think .sum { cursor:pointer; padding:7px 11px; color:#c8b6e0; font-size:12px; user-select:none; display:flex; align-items:center; gap:6px; }
  .think .sum::before { content:"▸"; font-size:10px; }                 /* 折叠态箭头 */
  .think:not(.collapsed) .sum::before { content:"▾"; }                 /* 展开态箭头 */
  .think .sum-label { white-space:nowrap; }
  .think .sum-dur { color:#9a86bd; white-space:nowrap; }
  .think .sum-preview { flex:1; min-width:0; color:#a895c4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }  /* 单行预览 */
  .think.live .sum::after { content:" ● 思考中"; color:var(--accent); animation:blink 1s steps(2,start) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .think .think-body { padding:4px 11px 9px; color:#b9a9d6; white-space:pre-wrap; word-break:break-word;
                border-top:1px dashed var(--think-line); max-height:260px; overflow:auto; font-size:13px; line-height:1.55; display:none; }
  .think:not(.collapsed) .think-body { display:block; }               /* 仅展开时显示全文 */

  /* —— 工具活动卡片：默认折叠，长内容收起，点开看详情 —— */
  .activity { display:flex; flex-direction:column; gap:6px; }
  .tool-card { font-size:12px; border:1px solid var(--line); border-radius:10px; background:#11141a; overflow:hidden; }
  .tool-card .tc-head { cursor:pointer; padding:6px 10px; color:#7fd1ff; display:flex; gap:6px; align-items:center; }
  .tool-card .tc-head::before { content:"▸"; font-size:10px; }
  .tool-card.expanded .tc-head::before { content:"▾"; }
  .tool-card .tc-name { font-weight:600; }
  .tool-card .tc-status { margin-left:auto; color:var(--muted); white-space:nowrap; }
  .tool-card .tc-dur { color:#6fa8c7; white-space:nowrap; }     /* 工具执行耗时，与思考面板 .sum-dur 同思路 */
  .tool-card .tc-args { display:none; padding:0 10px 6px; color:#aeb6c4; white-space:pre-wrap; word-break:break-word;
                        font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; }
  .tool-card .tc-result { display:none; padding:6px 10px; color:#9fe6c0; white-space:pre-wrap; word-break:break-word;
                         border-top:1px dashed var(--line); font-size:11px; max-height:180px; overflow:auto; }
  .tool-card.expanded .tc-args { display:block; }                      /* 展开才看入参 */
  .tool-card.expanded.has-result .tc-result { display:block; }         /* 有结果才展示出参 */

  /* —— 子 Agent：嵌在父回合内，事件和正文均不混入主回答 —— */
  .subagents { display:flex; flex-direction:column; gap:6px; }
  .subagent { border:1px solid #37506e; border-radius:10px; background:#121923; overflow:hidden; }
  .subagent .sa-head { cursor:pointer; padding:7px 10px; color:#9bc9ff; font-size:12px; display:flex; gap:6px; align-items:center; }
  .subagent .sa-head::before { content:"▸"; font-size:10px; }
  .subagent.expanded .sa-head::before { content:"▾"; }
  .subagent .sa-name { font-weight:600; }
  .subagent .sa-depth, .subagent .sa-dur { color:#7fa5d0; white-space:nowrap; }
  .subagent .sa-status { margin-left:auto; white-space:nowrap; color:var(--muted); }
  .subagent.live .sa-status { color:var(--accent); }
  .subagent .sa-body { display:none; padding:0 10px 10px; border-top:1px dashed #37506e; }
  .subagent.expanded .sa-body { display:block; }
  .subagent .sa-output { color:#b9cce1; white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.5; max-height:150px; overflow:auto; }
  .subagent .sa-tools { display:flex; flex-direction:column; gap:5px; margin-top:7px; }

  /* —— 正式回答：与思考过程明显分隔 —— */
  .answer-wrap { border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  .answer-label { padding:6px 11px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--line); letter-spacing:.04em; }
  .answer { padding:9px 12px; white-space:pre-wrap; word-break:break-word; line-height:1.65; min-height:20px; }
  .answer.empty::after { content:"生成中…"; color:var(--muted); }

  /* —— TASK-041 输入栏豆包化：📷 相机 ｜ 大输入框（/按住说话条）｜ 🎙 麦克风 ｜ ＋ 加号 —— */
  #bar { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #bar input[type=text] { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); color:var(--txt);
               border-radius:10px; padding:10px 12px; font-size:14px; outline:none; }
  #bar input[type=text]:focus { border-color:var(--accent); }
  #bar #cameraBtn, #bar #micBtn, #bar #plusBtn { background:var(--panel); color:var(--txt); border:1px solid var(--line);
               border-radius:10px; padding:0 12px; font-size:16px; cursor:pointer; }
  #bar #cameraBtn:hover, #bar #micBtn:hover, #bar #plusBtn:hover { border-color:var(--accent); }
  #bar #micBtn.voice-on { color:var(--accent); border-color:var(--accent); background:#1b2230; }
  #bar #micBtn.recording { background:#b13d4b; border-color:#e86b78; color:#fff; }
  /* 按住说话条：voice 模式替换输入框；touch-action:none 保证按住手势期间不随手指滚动页面 */
  #voiceBar { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); color:var(--muted);
              border-radius:10px; padding:10px 12px; font-size:14px; text-align:center; cursor:pointer;
              user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #voiceBar.holding { background:#2a2f3a; border-color:var(--accent); color:var(--txt); }
  #voiceBar.cancel { background:#3a2026; border-color:#e86b78; color:#ff8a94; }
  /* TASK-043：录音中 voiceBar —— 红点(::before) + 红色描边，与 .holding 叠加 */
  #voiceBar.recording { border-color:#e86b78; }
  #voiceBar.recording::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
               background:#e86b78; margin-right:7px; vertical-align:1px; }
  /* 顶栏：自动朗读（原在 bar，TASK-041 移到右上角 header）与回合停止键 */
  #ttsBtn.enabled { color:var(--ok); border-color:var(--ok); }
  #stopBtn { display:none; }
  #stopBtn.on { display:inline-block; background:#b13d4b; border-color:#e86b78; color:#fff; }
  #stopBtn:disabled { opacity:.6; cursor:default; }
  /* 轻提示（语音占位等）：自关闭，非阻塞 */
  #toast { position:fixed; left:50%; bottom:130px; transform:translateX(-50%); background:rgba(20,23,30,.94);
           color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:9px 16px; font-size:13px;
           max-width:80vw; text-align:center; pointer-events:none; opacity:0; transition:opacity .25s ease;
           z-index:200; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toast.show { opacity:1; }

  /* —— TASK-044 实时通话：header 打电话按钮 + 通话悬浮面板 —— */
  #callBtn.ringing { color:var(--ok); border-color:var(--ok); }
  #callPanel { position:fixed; left:50%; bottom:150px; transform:translateX(-50%);
               background:var(--panel); border:1px solid var(--line); border-radius:16px;
               padding:14px 18px; width:min(92vw,340px); z-index:150; text-align:center;
               box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #callPanel[hidden] { display:none; }
  .call-title { font-size:14px; color:var(--muted); margin-bottom:6px; }
  .call-status { font-size:18px; font-weight:600; margin-bottom:4px; }
  .call-status.ringing { color:var(--ok); }
  .call-status.error { color:#e86b78; }
  .call-trans { font-size:12px; color:var(--muted); min-height:18px; margin:6px 0;
                white-space:pre-wrap; word-break:break-word; }
  #callHangup { min-height:44px; min-width:120px; background:#b13d4b; color:#fff; border:none;
                border-radius:22px; font-size:15px; cursor:pointer; padding:0 20px; }
  #callHangup:disabled { opacity:.6; cursor:default; }
  /* 用户消息里的文件 chip（发送后即时回显；历史回放以文本 📎 形式在 content 中展示） */
  .file-strip { display:flex; flex-direction:column; gap:6px; margin-top:6px; align-items:flex-end; }
  .file-chip { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.16); border-radius:8px;
               padding:6px 10px; font-size:12px; max-width:100%; }
  .file-chip .fc-ico { font-size:15px; flex:none; }
  .file-chip .fc-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  .file-chip .fc-size { opacity:.75; flex:none; }

  /* —— 上下文占用进度条（usage 流事件；无数据时隐藏，不报错）—— */
  #ctxbar { padding:6px 16px 0; }
  #ctxbar.ctx-hidden { display:none; }
  .ctx-track { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .ctx-fill { height:100%; width:0; border-radius:3px; background:var(--accent); transition:width .3s ease; }
  .ctx-fill.warn { background:#d98c00; }
  .ctx-fill.danger { background:#b13d4b; }
  .ctx-meta { font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }

  /* —— 待发送图片预览条（粘贴/选择后、发送前）—— */
  #attach { display:none; gap:8px; padding:8px 16px 0; flex-wrap:wrap; }
  #attach.show { display:flex; }
  .att-item { position:relative; width:56px; height:56px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
  .att-item img { width:100%; height:100%; object-fit:cover; display:block; }
  /* 上传进度环：半透明遮罩盖在缩略图上，SVG 圆环 + 百分比（乖宝 2026-08-12 要求） */
  .att-progress { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
                  justify-content:center; gap:2px; background:rgba(0,0,0,.45); border-radius:8px; }
  .att-progress svg { width:34px; height:34px; }
  .att-progress .prog-ring { transform:rotate(-90deg); transform-origin:center; transition:stroke-dashoffset .15s linear; }
  .att-progress span { font-size:10px; color:#fff; line-height:1; }
  .att-item .att-del { position:absolute; top:0; right:0; background:rgba(0,0,0,.55); color:#fff; border:none;
                       cursor:pointer; font-size:11px; line-height:1; padding:2px 5px; border-radius:0 0 0 6px; }
  .att-item .att-del:hover { background:rgba(255,107,107,.85); }
  /* TASK-041：加号上传文件时的 chip 预览（图片仍走缩略图） */
  .att-item.file { display:flex; align-items:center; gap:6px; width:auto; min-width:120px; max-width:200px;
                   height:auto; padding:8px 28px 8px 10px; }
  .att-item.file .att-ico { font-size:16px; flex:none; }
  .att-item.file .att-name { font-size:11px; color:var(--txt); white-space:nowrap; overflow:hidden;
                             text-overflow:ellipsis; min-width:0; flex:1; }
  .att-item.file .att-del { position:absolute; top:0; right:0; }

  /* —— 消息里的图片条（用户气泡下方 / 历史回放）—— */
  .img-strip { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; justify-content:flex-end; }
  .img-strip img { max-width:180px; max-height:180px; border-radius:8px; border:1px solid var(--line); display:block; }
  /* 机器人回合内联生成的图片：左对齐，放在「工具活动」与「正式回答」之间 */
  .bot-images { justify-content:flex-start; margin-top:8px; }
  .bot-images img { max-width:360px; max-height:360px; }
  #config { display:none; padding:16px; border-top:1px solid var(--line); overflow-y:auto; max-height:55vh; }
  #config.show { display:block; }
  #config h2 { font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:500; }
  #config label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  #config input { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt);
                  border-radius:8px; padding:8px 10px; font-size:13px; margin-bottom:10px; outline:none; }
  #config input:focus { border-color:var(--accent); }
  #config .row { display:flex; gap:10px; }
  #config .row > div { flex:1; }
  #config .actions { display:flex; gap:10px; margin-top:6px; }
  #config .actions button { flex:1; padding:9px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid var(--line); }
  #saveBtn { background:var(--ok); color:#06281c; border:none; font-weight:500; }
  #cfgMsg { font-size:12px; color:var(--muted); }

  /* —— 会话侧边栏布局 —— */
  #app { flex:1; display:flex; min-height:0; overflow:hidden; }
  #sidebar { width:264px; flex:none; border-right:1px solid var(--line); background:var(--panel);
             display:flex; flex-direction:column; min-height:0; }
  #sidebar .sb-head { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  #sidebar .sb-head h2 { font-size:13px; margin:0; font-weight:500; }
  #sidebar .sb-head button { margin-left:auto; background:var(--accent); color:#fff; border:none;
                             border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; }
  #sidebar .sb-head button:hover { filter:brightness(1.1); }
  #sidebar .sb-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .sb-item { position:relative; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
             cursor:pointer; background:#11141a; }
  .sb-item:hover { border-color:var(--accent); }
  .sb-item.active { border-color:var(--accent); background:#1b2230; }
  .sb-item .sb-title { font-size:13px; color:var(--txt); white-space:nowrap; overflow:hidden;
                       text-overflow:ellipsis; padding-right:24px; }
  .sb-item .sb-preview { font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap;
                         overflow:hidden; text-overflow:ellipsis; }
  .sb-item .sb-time { font-size:10px; color:var(--muted); margin-top:3px; }
  .sb-item .sb-del { position:absolute; top:6px; right:6px; background:transparent; border:none;
                     color:var(--muted); cursor:pointer; font-size:12px; line-height:1; padding:2px 5px;
                     border-radius:6px; }
  .sb-item .sb-del:hover { color:#ff6b6b; background:rgba(255,107,107,.12); }
  /* TASK-045：会话「执行中」徽标（呼吸动画提示在途任务，不破坏现有布局） */
  .sb-item .sb-active { display:inline-flex; align-items:center; gap:4px; margin-top:4px;
                        font-size:10px; line-height:1.4; color:#e0a23a;
                        background:rgba(224,162,58,.12); border:1px solid rgba(224,162,58,.32);
                        border-radius:6px; padding:1px 6px; width:fit-content;
                        animation:sbBreath 1.6s ease-in-out infinite; }
  @keyframes sbBreath { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  /* ================================================================
     TASK-039 移动端适配（断点 ≤768px：iPhone/Android 手机、窄屏）
     —— 全部叠加仅在本媒体查询内；桌面（≥769px）样式与改造前完全一致 ——
     ================================================================ */
  @media (max-width: 768px) {
    /* 1) 高度：100vh 兜底 + 100dvh 覆盖（iOS Safari 软键盘弹出时不顶飞底部输入栏） */
    body { height:100vh; height:100dvh; }
    html { -webkit-tap-highlight-color: transparent; }

    /* 2) 侧边栏抽屉化：fixed + translateX 默认隐藏；汉堡按钮开合，点遮罩/选会话自动关闭 */
    header { padding:8px 10px; gap:8px; }
    header h1 { font-size:16px; }
    #status { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #sbToggle { display:inline-flex; align-items:center; justify-content:center;
                min-width:44px; min-height:44px; padding:0 8px; font-size:18px; }
    #sidebar { position:fixed; left:0; top:0; bottom:0; z-index:100;
               width:min(78vw,300px); transform:translateX(-100%);
               transition:transform .25s ease; box-shadow:0 0 24px rgba(0,0,0,.5); }
    body.sb-open #sidebar { transform:translateX(0); }
    #sbMask { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.45); display:none; }
    body.sb-open #sbMask { display:block; }

    /* 3) 输入栏与软键盘：底部安全区、16px 防 iOS 自动缩放、44px 触控目标 */
    #bar { gap:6px; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); }
    #bar input[type=text] { font-size:16px; min-height:44px; }
    #voiceBar { font-size:16px; min-height:44px; }
    #bar #cameraBtn, #bar #micBtn, #bar #plusBtn { min-width:44px; padding:0; font-size:20px; }

    /* 4) 触控反馈：手机无 hover，补 :active 等价样式（不影响桌面 hover 外观） */
    header button { min-height:44px; font-size:14px; padding:5px 14px; }
    header button:active { border-color:var(--accent); }
    #bar #cameraBtn:active, #bar #micBtn:active, #bar #plusBtn:active { border-color:var(--accent); background:#1e2430; }
    #sidebar .sb-head button { min-height:44px; font-size:14px; padding:5px 14px; }
    #sidebar .sb-head button:active { filter:brightness(1.1); }
    .sb-item:active { border-color:var(--accent); }
    .sb-item .sb-del:active { color:#ff6b6b; background:rgba(255,107,107,.12); }
    .att-item .att-del:active { background:rgba(255,107,107,.85); }
    .think .sum:active, .tool-card .tc-head:active, .subagent .sa-head:active { background:rgba(255,255,255,.06); }

    /* 5) 字号/间距微调（基础 13px → 15px 级别，消息间距略放宽） */
    #chat { padding:14px 12px; gap:14px; }
    .msg.sys { font-size:13px; }
    .msg.user .bubble { padding:10px 14px; font-size:16px; }
    .answer-label { font-size:12px; }
    .answer { font-size:16px; line-height:1.7; }
    .think .sum { font-size:13px; padding:10px 12px; }
    .think .think-body { font-size:14px; line-height:1.6; }
    .tool-card { font-size:13px; }
    .tool-card .tc-head { padding:10px; }
    .tool-card .tc-args, .tool-card .tc-result { font-size:12px; }
    .subagent .sa-head { font-size:13px; padding:10px; }
    .subagent .sa-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .subagent .sa-output { font-size:13px; }
    #sidebar .sb-head { padding:12px; }
    #sidebar .sb-head h2 { font-size:15px; }

<script>
(function () {
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var stopBtn = document.getElementById('stopBtn');
  // —— 聊天区 sticky scroll：贴底才自动跟随，用户上滑读历史时不被拉回 ——
  var nearBottom = true;   // 是否在底部附近（阈值 80px）；贴底才自动滚动到底
  function scrollChatToBottom() {
    if (nearBottom) chat.scrollTop = chat.scrollHeight;
  }
  chat.addEventListener('scroll', function () {
    nearBottom = (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80);
  });
  var statusEl = document.getElementById('status');
  var cfgBtn = document.getElementById('cfgBtn');
  var cfgPanel = document.getElementById('config');
  var cfgMsg = document.getElementById('cfgMsg');
  var FIELDS = ['api_key','base_url','model','subagent_model','workspace','timezone','max_iterations','turn_timeout_sec','shell_timeout_sec','identity_file','feishu_app_id','feishu_app_secret','web_host','web_port'];

  // —— 网页 TTS：只消费本页收到的、实时 Agent token；不保存开关状态 ——
  var ttsBtn = document.getElementById('ttsBtn');
  var ttsEnabled = false;
  var ttsGeneration = 0;       // 失效旧 fetch / 音频，防止关闭后迟到播放
  var ttsReplySeq = 0;
  var ttsQueue = [];           // 待合成文本；最多积压三段，过快时合并末段
  var ttsPrepared = {};        // seq -> 已合成音频；乱序返回也不改变播放顺序
  var ttsInFlight = 0;
  var ttsAborts = {};          // seq -> { controller, replyId }
  var ttsNextSeq = 0;
  var ttsNextPlaySeq = 0;
  var ttsSkipped = {};         // 合成失败/取消的序号，防止后续段被它阻塞
  var ttsCurrent = null;
  var ttsFailedReplies = {};
  var ttsDiscardUntilDone = false; // 新消息/切会话时，不让旧回合的迟到 token 开始朗读
  var ttsAudio = new Audio();  // 复用单个播放器，确保关闭可立即停止

  function updateTtsButton() {
    ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
    ttsBtn.title = ttsEnabled ? '关闭自动朗读并停止播放' : '开启自动朗读';
    ttsBtn.setAttribute('aria-label', ttsBtn.title);
    ttsBtn.setAttribute('aria-pressed', ttsEnabled ? 'true' : 'false');
    ttsBtn.classList.toggle('enabled', ttsEnabled);
  }

  function revokePrepared() {
    Object.keys(ttsPrepared).forEach(function (seq) {
      if (ttsPrepared[seq].url) URL.revokeObjectURL(ttsPrepared[seq].url);
    });
    ttsPrepared = {};
  }

  function stopTts() {
    ttsGeneration += 1;
    Object.keys(ttsAborts).forEach(function (seq) { ttsAborts[seq].controller.abort(); });
    ttsAborts = {};
    ttsInFlight = 0;
    ttsQueue = [];
    revokePrepared();
    ttsSkipped = {};
    ttsNextSeq = 0;
    ttsNextPlaySeq = 0;
    ttsFailedReplies = {};
    if (ttsCurrent && ttsCurrent.url) URL.revokeObjectURL(ttsCurrent.url);
    ttsCurrent = null;
    ttsAudio.onended = null;
    ttsAudio.onerror = null;
    ttsAudio.pause();
    ttsAudio.currentTime = 0;
    ttsAudio.removeAttribute('src');
    ttsAudio.load();
  }

  function stopTtsForTransition() {
    // 同会话的新消息会排队，旧 Agent 回合仍可能继续推 token；在它的 done 前静音。
    if (cur) ttsDiscardUntilDone = true;
    stopTts();
  }

  function failTtsReply(replyId, err) {
    // 单段失败只放弃本次 Agent 回复的剩余朗读；聊天和开关均不受影响。
    ttsFailedReplies[replyId] = true;
    ttsQueue = ttsQueue.filter(function (item) {
      if (item.replyId === replyId) { ttsSkipped[item.seq] = true; return false; }
      return true;
    });
    Object.keys(ttsPrepared).forEach(function (seq) {
      var item = ttsPrepared[seq];
      if (item.replyId === replyId) {
        ttsSkipped[item.seq] = true;
        URL.revokeObjectURL(item.url);
        delete ttsPrepared[seq];
      }
    });
    Object.keys(ttsAborts).forEach(function (seq) {
      var pending = ttsAborts[seq];
      if (pending.replyId === replyId) {
        ttsSkipped[Number(seq)] = true;
        pending.controller.abort();
      }
    });
    console.warn('TTS 分段失败，已跳过本轮剩余朗读：', err);
  }

  function playNextTts() {
    if (ttsCurrent || !ttsEnabled) return;
    while (ttsSkipped[ttsNextPlaySeq]) {
      delete ttsSkipped[ttsNextPlaySeq];
      ttsNextPlaySeq += 1;
    }
    var item = ttsPrepared[ttsNextPlaySeq];
    if (!item) return; // 等待较早的并发请求，严格按文本先后播放
    delete ttsPrepared[ttsNextPlaySeq];
    ttsNextPlaySeq += 1;
    if (ttsFailedReplies[item.replyId]) { URL.revokeObjectURL(item.url); pumpTts(); return; }
    ttsCurrent = item;
    ttsAudio.onended = function () {
      if (ttsCurrent === item) {
        URL.revokeObjectURL(item.url);
        ttsCurrent = null;
        pumpTts();
      }
    };
    ttsAudio.onerror = function () {
      if (ttsCurrent === item) {
        URL.revokeObjectURL(item.url);
        ttsCurrent = null;
        failTtsReply(item.replyId, 'audio playback error');
        pumpTts();
      }
    };
    ttsAudio.src = item.url;
    ttsAudio.play().catch(function (err) {
      // 自动播放策略、设备错误等都只能降级，绝不能影响聊天。
      if (ttsCurrent === item) {
        URL.revokeObjectURL(item.url);
        ttsCurrent = null;
        failTtsReply(item.replyId, err);
        pumpTts();
      }
    });
    // 当前段播放期间立即预合成下一段，降低句间停顿。
    pumpTts();
  }

  function startTtsSynthesis(item) {
    var generation = ttsGeneration;
    var controller = new AbortController();
    ttsInFlight += 1;
    ttsAborts[item.seq] = { controller: controller, replyId: item.replyId };
    fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: item.text }),
        signal: controller.signal
    }).then(function (response) {
        if (!response.ok) throw new Error('TTS 请求失败（' + response.status + '）');
        return response.blob();
    }).then(function (blob) {
        if (!ttsEnabled || generation !== ttsGeneration || ttsFailedReplies[item.replyId]) return;
        if (!blob.size) throw new Error('TTS 返回了空音频');
        ttsPrepared[item.seq] = { replyId: item.replyId, url: URL.createObjectURL(blob) };
    }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        if (generation === ttsGeneration) {
          ttsSkipped[item.seq] = true;
          failTtsReply(item.replyId, err);
        }
    }).finally(function () {
        if (generation !== ttsGeneration) return;
        delete ttsAborts[item.seq];
        ttsInFlight = Math.max(0, ttsInFlight - 1);
        pumpTts();
    });
  }

  function pumpTts() {
    if (!ttsEnabled) return;
    playNextTts();
    // 在途请求 + 已就绪音频合计最多两段，避免播放赶不上合成时 Blob 无界增长。
    while (ttsInFlight < 2 && (ttsInFlight + Object.keys(ttsPrepared).length) < 2 && ttsQueue.length) {
      var item = ttsQueue.shift();
      if (ttsFailedReplies[item.replyId]) { ttsSkipped[item.seq] = true; continue; }
      startTtsSynthesis(item);
    }
    playNextTts();
  }

  function enqueueTts(text, replyId) {
    text = (text || '').trim();
    if (!text || !ttsEnabled || ttsFailedReplies[replyId]) return;
    // 同时最多积压三段待合成文本；极端高速输出时合并末段，不丢正文。
    if (ttsQueue.length >= 3) ttsQueue[ttsQueue.length - 1].text += ' ' + text;
    else ttsQueue.push({ text: text, replyId: replyId, seq: ttsNextSeq++ });
    pumpTts();
  }

  function isStrongTtsBoundary(ch) {
    return /[。！？!?；;]/.test(ch) || ch === String.fromCharCode(10);
  }

  function findTtsBoundary(buf, limit, minLength) {
    var strong = -1;
    var weak = -1;
    for (var i = 0; i < Math.min(buf.length, limit); i++) {
      var n = i + 1;
      if (n < minLength) continue;
      var ch = buf.charAt(i);
      if (isStrongTtsBoundary(ch)) strong = n;
      else if (/[，,：:]/.test(ch)) weak = n;
    }
    // 完整句末优先于逗号等弱边界；都没有时由调用方决定是否硬切。
    return strong >= 0 ? strong : weak;
  }

  function chooseTtsCut(turn, buf) {
    var firstSegment = turn.ttsSegmentCount === 0;
    if (firstSegment) {
      // 第一完整句尽快开口，降低首段等待；短语/逗号仍继续累计。
      for (var i = 0; i < buf.length; i++) {
        if (i + 1 >= 8 && isStrongTtsBoundary(buf.charAt(i))) return i + 1;
      }
    } else {
      // 后续把多个短句合成较自然的段落，再在完整句末切开。
      for (var j = 39; j < buf.length; j++) {
        if (isStrongTtsBoundary(buf.charAt(j))) return j + 1;
      }
    }

    // 首段没有句号时可在较长分句处启动；后续逗号只作长文本回退。
    var fallbackAt = firstSegment ? 32 : 80;
    var fallbackMin = firstSegment ? 16 : 40;
    if (buf.length >= fallbackAt) {
      var longBoundary = findTtsBoundary(buf, fallbackAt, fallbackMin);
      if (longBoundary >= 0) return longBoundary;
    }
    // 无标点文本只在达到较高上限时切开；仍优先选择完整句或分句边界。
    var hardLimit = firstSegment ? 64 : 120;
    if (buf.length >= hardLimit) {
      var safeBoundary = findTtsBoundary(buf, hardLimit, fallbackMin);
      return safeBoundary >= 0 ? safeBoundary : hardLimit;
    }
    return -1;
  }

  function flushTtsSegments(turn, force) {
    if (ttsDiscardUntilDone || !turn.ttsEligible || turn.ttsGeneration !== ttsGeneration || !ttsEnabled) return;
    var buf = turn.ttsBuffer || '';
    while (buf) {
      var cut = chooseTtsCut(turn, buf);
      if (cut < 0) {
        if (force) { enqueueTts(buf, turn.ttsReplyId); buf = ''; }
        break;
      }
      enqueueTts(buf.slice(0, cut), turn.ttsReplyId);
      turn.ttsSegmentCount += 1;
      buf = buf.slice(cut);
    }
    turn.ttsBuffer = buf;
  }

  function collectTtsToken(turn, text) {
    if (ttsDiscardUntilDone || !turn.ttsEligible || turn.ttsGeneration !== ttsGeneration || !ttsEnabled) return;
    turn.ttsBuffer += (text || '');
    flushTtsSegments(turn, false);
  }

  ttsBtn.onclick = function () {
    if (ttsEnabled) {
      ttsEnabled = false;
      stopTts();
    } else {
      ttsEnabled = true;
    }
    updateTtsButton();
  };
  updateTtsButton();

  function addUser(text, imgUrls, files) {
    var m = document.createElement('div'); m.className = 'msg user';
    if (text) {
      var b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
      m.appendChild(b);
    }
    if (imgUrls && imgUrls.length) {
      var strip = document.createElement('div'); strip.className = 'img-strip';
      imgUrls.forEach(function (u) {
        var im = document.createElement('img'); im.src = u; im.loading = 'lazy';
        strip.appendChild(im);
      });
      m.appendChild(strip);
    }
    // TASK-041：文件 chip 即时回显（历史回放以 content 里的 📎 文本展示）
    if (files && files.length) {
      var chips = document.createElement('div'); chips.className = 'file-strip';
      files.forEach(function (f) {
        var c = document.createElement('span'); c.className = 'file-chip';
        c.innerHTML = '<span class="fc-ico">📄</span><span class="fc-name"></span><span class="fc-size"></span>';
        c.querySelector('.fc-name').textContent = f.name || '文件';
        c.querySelector('.fc-size').textContent = humanSize(f.size);
        c.title = (f.name || '文件') + '（' + humanSize(f.size) + '）';
        chips.appendChild(c);
      });
      m.appendChild(chips);
    }
    chat.appendChild(m); scrollChatToBottom();
  }
  function addSys(text) {
    var m = document.createElement('div'); m.className = 'msg sys'; m.textContent = text;
    chat.appendChild(m); scrollChatToBottom();
  }

  // —— 一个 bot 回合 = 思考面板(默认折叠) + 工具活动(默认折叠) + 正式回答 ——
  var cur = null;
  function newTurn() {
    var root = document.createElement('div'); root.className = 'msg bot';

    // 思考面板：默认折叠 (collapsed)，标题行展示「单行预览 + 思考时长」
    var think = document.createElement('div'); think.className = 'think live collapsed';
    think.innerHTML = '<div class="sum"><span class="sum-label">💭 思考过程</span>'
                    + '<span class="sum-preview"></span>'
                    + '<span class="sum-dur"></span></div>'
                    + '<div class="think-body"></div>';

    var activity = document.createElement('div'); activity.className = 'activity';
    var subagents = document.createElement('div'); subagents.className = 'subagents';

    // 机器人回合内联图片条（生图工具 generate_image 的 image 事件会往这里塞 <img>）
    var botImages = document.createElement('div'); botImages.className = 'img-strip bot-images';

    var ansWrap = document.createElement('div'); ansWrap.className = 'answer-wrap';
    ansWrap.innerHTML = '<div class="answer-label">正式回答</div><div class="answer empty"></div>';
    var answer = ansWrap.querySelector('.answer');

    root.appendChild(think);
    root.appendChild(activity);
    root.appendChild(subagents);
    root.appendChild(botImages);
    root.appendChild(ansWrap);
    chat.appendChild(root); scrollChatToBottom();
    return { root: root, think: think,
             thinkBody: think.querySelector('.think-body'),
             thinkPreview: think.querySelector('.sum-preview'),
             thinkDur: think.querySelector('.sum-dur'),
             activity: activity, subagents: subagents, subagentRuns: {}, botImages: botImages, answer: answer,
             answerStarted: false, lastTool: null,
             ttsEligible: ttsEnabled, ttsGeneration: ttsGeneration,
             ttsReplyId: ++ttsReplySeq, ttsBuffer: '', ttsSegmentCount: 0,
             thinkStart: performance.now(), thinkEnded: false };
  }

  // —— 思考时长：从回合开始到「正式回答首次出现」的耗时（含工具调用）——
  function fmtDur(ms) { return ' · ' + (ms / 1000).toFixed(1) + 's'; }
  function finishThink(c) {
    if (c.thinkEnded) return;
    c.thinkEnded = true;
    if (!c.thinkBody.textContent.trim()) {
      c.thinkPreview.textContent = '（模型未返回思考内容）';
    }
    c.thinkDur.textContent = fmtDur(performance.now() - c.thinkStart);
  }

  function subagentLabel(depth) {
    return depth > 0 ? ('第 ' + depth + ' 层') : '子 Agent';
  }
  function newSubagentPanel(turn, run) {
    var runId = String(run.run_id || run.id || ('history-' + Object.keys(turn.subagentRuns).length));
    if (turn.subagentRuns[runId]) return turn.subagentRuns[runId];
    var depth = Number(run.depth || 0);
    var root = document.createElement('div'); root.className = 'subagent live';
    // 仅作轻量视觉层级，不让异常 depth 把面板推到屏幕外。
    root.style.marginLeft = (Math.min(Math.max(depth, 0), 4) * 12) + 'px';
    root.innerHTML = '<div class="sa-head"><span class="sa-name"></span><span class="sa-depth"></span>'
                   + '<span class="sa-status">⏳ 运行中</span><span class="sa-dur"></span></div>'
                   + '<div class="sa-body"><div class="sa-output"></div><div class="sa-tools"></div></div>';
    root.querySelector('.sa-name').textContent = '🤖 ' + (run.agent_name || run.name || '子 Agent');
    root.querySelector('.sa-depth').textContent = subagentLabel(depth);
    turn.subagents.appendChild(root);
    var panel = { id: runId, root: root, output: root.querySelector('.sa-output'), tools: root.querySelector('.sa-tools'),
                  status: root.querySelector('.sa-status'), dur: root.querySelector('.sa-dur'), lastTool: null,
                  start: performance.now(), ended: false };
    panel.timer = setInterval(function () {
      if (!panel.ended) panel.dur.textContent = fmtDur(performance.now() - panel.start);
    }, 100);
    turn.subagentRuns[runId] = panel;
    return panel;
  }
  function appendSubagentTool(panel, ev) {
    var card = document.createElement('div'); card.className = 'tool-card';
    card.innerHTML = '<div class="tc-head"><span class="tc-name"></span><span class="tc-status">⏳ 执行中</span><span class="tc-dur"></span></div>'
                   + '<div class="tc-args"></div><div class="tc-result"></div>';
    card.querySelector('.tc-name').textContent = '🔧 ' + (ev.name || '工具');
    card.querySelector('.tc-args').textContent = ev.args != null ? String(ev.args) : '';
    card._start = performance.now();
    card._timer = setInterval(function () { card.querySelector('.tc-dur').textContent = fmtDur(performance.now() - card._start); }, 100);
    panel.tools.appendChild(card); panel.lastTool = card;
    return card;
  }
  function finishSubagentTool(card, ev) {
    if (!card) return;
    if (card._timer) { clearInterval(card._timer); card._timer = null; }
    card.classList.add('has-result');

    card.querySelector('.tc-dur').textContent = fmtDur(ms);

    else if (toolStatus === 'cancelled' || toolStatus === 'canceled') card.querySelector('.tc-status').textContent = '⚪ 已取消';

  function finishSubagentPanel(panel, ev) {

    panel.tools.querySelectorAll('.tool-card').forEach(function (card) {

    });

  function onSubagentEvent(turn, wrapped) {

  function onEvent(ev) {

      return;

      if (currentKey) usageByKey[currentKey] = ev;
      renderCtxBar();
      return;
    }
    if (t === 'usage_turn') {
      // 回合级汇总：整轮调用次数/累计输入/命中率，回合结束时一次性推送。
      // 与 usage 一样按会话保存并刷新进度条（覆盖单次事件，展示整轮概览）。
      if (currentKey) usageByKey[currentKey] = ev;

      card.querySelector('.tc-args').textContent = (ev.args != null ? ev.args : '');

        var durMs = (typeof ev.duration_ms === 'number') ? ev.duration_ms

  // 点标题折叠/展开：思考面板 (.sum)、子 Agent (.sa-head) 与工具卡片 (.tc-head)

  var proto = location.protocol === 'https:' ? 'wss' : 'ws';

  // 建立 WebSocket；断线后自动重连（指数退避），连上后自动接回当前会话。
  // 解决：Mac 睡眠 / 重启实例后，浏览器旧连接死掉、一直「已断开」需手动刷新的问题。
  function connectWS() {
    ws = new WebSocket(proto + '://' + location.host + '/ws');
    ws.onopen = function () {
      statusEl.textContent = '已连接';
      statusEl.style.color = 'var(--ok)';
      _reconnectDelay = 1000;           // 连接成功，重置退避
      _disconnectNotified = false;      // 恢复后允许下次断线再次提示
      // TASK-046：重连自动接管原会话并补拉历史（断网期间任务跑完的结果一次看全）。
      // 后端已按会话广播事件流，open 后后续进展会自动续上，无需手动刷新。
      if (currentKey) {
        var reqKey = currentKey;
        ws.send(JSON.stringify({ ctl: true, type: 'open', key: reqKey }));
        fetch('/api/session?key=' + encodeURIComponent(reqKey))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (currentKey !== reqKey) return;   // 期间用户切换了会话则不打扰
            // TASK-046：任务仍在跑时**保留现有聊天渲染**（断线前已输出的思考/回答
            // 不消失），后续事件会自动续流；任务已完成/无任务时才全量重渲染补拉历史。
            return fetch('/api/sessions').then(function (r) { return r.json(); }).then(function (sd) {
              var active = false;

      if (!_disconnectNotified) {

  function humanSize(n) {
    var size = Math.max(0, Number(n) || 0);
    var unit = 'B';
    while (size >= 1024 && unit !== 'GB') {
      size /= 1024;
      unit = unit === 'B' ? 'KB' : (unit === 'KB' ? 'MB' : 'GB');
    }
    return unit === 'B' ? Math.round(size) + 'B' : (size < 10 ? size.toFixed(1) : Math.round(size)) + unit;
  }

  // 统一上传：图片 → /upload 走 ImageStore（返回 image_id）；文件 → 走 FileStore
  // （返回 file_id/name/path/size/mime），后端按 MIME/扩展名自动分流。
  // 统一上传：图片 → /upload 走 ImageStore（返回 image_id）；文件 → 走 FileStore
  // （返回 file_id/name/path/size/mime），后端按 MIME/扩展名自动分流。
  // 用 XHR 而非 fetch：fetch 拿不到上传进度，XHR 的 upload.onprogress 可以
  // （乖宝 2026-08-12 要求：上传慢要有进度显示，不能干等像卡死）。
  function uploadOne(file, key, onProgress) {
    return new Promise(function (resolve, reject) {
      var fd = new FormData();
      fd.append('file', file, file.name || 'pasted.png');
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload?key=' + encodeURIComponent(key));
      xhr.timeout = 180000;  // 单文件 3 分钟超时（文件大，别催）
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var d = JSON.parse(xhr.responseText);
            if (!d || !d.ok) reject(new Error((d && d.error) || '上传失败'));
            else resolve(d);
          } catch (err) { reject(new Error('上传响应解析失败')); }
        } else {
          reject(new Error('上传失败（HTTP ' + xhr.status + '）'));
        }
      };
      xhr.onerror = function () { reject(new Error('网络错误，上传失败')); };
      xhr.ontimeout = function () { reject(new Error('上传超时')); };
      if (xhr.upload && onProgress) {
        xhr.upload.onprogress = function (e) {
          if (e.lengthComputable) onProgress(e.loaded, e.total);
        };
      }
      xhr.send(fd);
    });
  }

  // 图片压缩（乖宝 2026-08-12 拍板）：最长边 1600px、JPEG 质量 85%。
  // 手机原图 5~10MB → 几百 KB，上传秒级；小图（<1MB 且不需缩放）不压；
  // 压缩失败/非标准图回退原文件，绝不阻断发送。文件（pdf 等）不压缩。
  function compressImage(file, maxDim, quality) {
    maxDim = maxDim || 1600;
    quality = quality || 0.85;
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        if (scale >= 1 && file.size < 1024 * 1024) { resolve(file); return; }  // 小图不压
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var newName = (file.name.replace(/\.[^.]+$/, '') || 'image') + '.jpg';
        canvas.toBlob(function (blob) {
          if (blob && blob.size > 0) resolve(new File([blob], newName, { type: 'image/jpeg' }));
          else resolve(file);
        }, 'image/jpeg', quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  // —— 附件自动上传（乖宝 2026-08-12：选图即传，不用等回车）——
  var RING_C = 100.53;   // 圆环周长 2πr (r=16)
  function updateAttRing(it, pct) {
    var pg = it.el && it.el.querySelector('.att-progress');
    if (!pg) return;
    var ring = pg.querySelector('.prog-ring');
    var label = pg.querySelector('span');
    pct = Math.min(100, Math.max(0, pct || 0));
    if (ring) { ring.style.stroke = '#4cc2ff'; ring.style.strokeDashoffset = RING_C * (1 - pct / 100); }
    if (label) { label.style.display = 'block'; label.textContent = pct + '%'; }
    // 不在此处隐藏：onProgress 100% 只表示字节已发完，后端响应（done）才算真正完成；
    // 否则出现「圈消失但还提示上传中」的时序错觉（乖宝 2026-08-12 实测）
    pg.style.display = 'flex';
  }
  function hideAttRing(it) {
    var pg = it.el && it.el.querySelector('.att-progress');
    if (pg) pg.style.display = 'none';
  }
  function resetAttRing(it) {
    var pg = it.el && it.el.querySelector('.att-progress');
    if (!pg) return;
    var ring = pg.querySelector('.prog-ring');
    var label = pg.querySelector('span');
    if (ring) { ring.style.stroke = 'rgba(255,255,255,.5)'; ring.style.strokeDashoffset = RING_C; }
    if (label) label.style.display = 'none';
    pg.style.display = 'flex';
  }
  function uploadAtt(it, i) {
    if (!currentKey || it.upState === 'uploading' || it.upState === 'done') return;
    it.upState = 'uploading';
    console.log('[upload] start idx=' + i, it.file && it.file.name, (it.file && it.file.size) || 0);
    var prep = (it.kind === 'image' && it.file && it.file.type && it.file.type.indexOf('image/') === 0)
      ? compressImage(it.file).then(function (blob) { return blob; })
      : Promise.resolve(it.file);
    prep.then(function (uploadFile) {
      return uploadOne(uploadFile, currentKey, function (loaded, total) {
        updateAttRing(it, total > 0 ? Math.round(loaded / total * 100) : 0);
      });
    }).then(function (d) {
      it.ref = d;
      it.upState = 'done';
      console.log('[upload] done idx=' + i, d && (d.image_id || d.file_id));
      hideAttRing(it);   // 真正完成（后端响应）才隐藏圈
    }).catch(function (e) {
      it.upState = 'error';
      console.log('[upload] error idx=' + i, e);
      resetAttRing(it);
      addSys('「' + (it.file && it.file.name || '附件') + '」上传失败：' + (e && e.message || e) + '，可删除后重新添加');
    });
  }
  function tryAutoUploads() {
    if (!currentKey) return;
    pendingAtts.forEach(function (it, i) { uploadAtt(it, i); });
  }

  // —— 停止键（TASK-041 从底部 bar 移入右上角 header）：回合进行中显示 ⏹，
  //     点击后取消当前回合；回合结束/断线自动隐藏，防重复点击时禁用 ——
  var stopping = false;          // 停止请求已发出（防重复点击）
  var stopRetryTimer = null;     // 兜底：done 迟迟未到则恢复可点击，允许重试

  function updateStopBtn() {
    if (stopRetryTimer) { clearTimeout(stopRetryTimer); stopRetryTimer = null; }
    if (cur) {
      stopBtn.classList.add('on');
      stopBtn.disabled = stopping;
    } else {
      stopBtn.classList.remove('on');
      stopBtn.disabled = false;
      stopping = false;
    }

  function stopTurn() {
    if (!cur || stopping) return;
    stopping = true;
    updateStopBtn();
    if (!ws || ws.readyState !== WebSocket.OPEN) {

      updateStopBtn();
      return;
    }

      ws.send(JSON.stringify({ ctl: true, type: 'cancel' }));
    } catch (err) {

      updateStopBtn();
      return;
    }

    stopRetryTimer = setTimeout(function () {

      stopping = false;

  var sending = false;   // 上传期间防重复发送
  var sendingTimer = null;  // 上传超时兜底计时器
  function send() {
    console.log('[send] enter', { text: input.value, atts: pendingAtts.map(function (it) { return it.upState; }) });
    if (recorder || recordingBusy) {
      addSys(recorder ? '正在录音，请先停止录音。' : '正在转写语音，请稍候。');
      return;
    }
    if (sending) { addSys('上传未完成，稍等…'); return; }
    var text = input.value.trim();
    var hasAtts = pendingAtts.length > 0;
    if (!text && !hasAtts) return;
    if (ws.readyState !== WebSocket.OPEN) { addSys('连接已断开，请稍候重试…'); return; }

    if (!hasAtts) {          // 纯文本：维持原路径（命令等均不受影响）
      stopTtsForTransition();
      addUser(text);
      cur = newTurn();
      updateStopBtn();   // 回合开始：header 出现 ⏹ 停止
      ws.send(text);
      input.value = '';
      return;
    }
    // 带附件（图片/文件）：选图即自动上传（addPendingFile → tryAutoUploads），
    // 这里只检查上传状态并发送引用，不再触发上传（乖宝 2026-08-12：不用点回车才开始传）。
    var atts = pendingAtts.slice();
    var hasError = atts.some(function (it) { return it.upState === 'error'; });
    var hasUploading = atts.some(function (it) { return it.upState === 'uploading' || it.upState === 'pending'; });
    if (hasError) { addSys('有附件上传失败，请删除后重新添加'); return; }
    if (hasUploading) { addSys('图片/文件上传中，稍等…'); return; }
    var images = [], files = [];
    atts.forEach(function (it) {
      if (!it.ref) return;
      if (it.kind === 'image') images.push(it.ref.image_id);
      else files.push({ file_id: it.ref.file_id, path: it.ref.path, name: it.ref.name, size: it.ref.size, mime: it.ref.mime });
    });
    if (images.length === 0 && files.length === 0) { addSys('附件未就绪，请重试'); return; }
    stopTtsForTransition();
    addUser(text,
            atts.filter(function (it) { return it.kind === 'image'; }).map(function (it) { return it.url; }),
            atts.filter(function (it) { return it.kind === 'file'; }).map(function (it) { return it.file; }));
    cur = newTurn();
    updateStopBtn();
    ws.send(JSON.stringify({ text: text, images: images, files: files }));

    pendingAtts = [];
    renderAttach();

  }
  stopBtn.onclick = function () {   // TASK-041：停止键移到 header，仅回合进行中可见
    if (cur) stopTurn();
  };
  // 回车发送：非组词回车直接发；中文输入法组词中的回车只负责上屏候选词、不发送
  // （第二次回车才发）——乖宝 2026-08-12 明确不要「按一次就发」。
  // form submit 兜底仅服务手机键盘「发送」键：iOS 的 enterkeyhint=send 键点击触发
  // 的是 form submit 而非 keydown（安卓某些输入法同理），桌面不受影响。
  var barForm = document.getElementById('bar');
  input.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;

    // （尤其国产）派发的 keydown 的 keyCode 常恒为 229，会导致回车永远发不出去

    if (e.isComposing) return;   // 组词中：交给输入法上屏，不发送

  // —— TASK-041 语音模式 + 按住说话手势 + 旧 ASR 录音（长按 🎙 触发）——
  // 麦克风按钮（micBtn）三态：
  //   1) 空闲·键盘模式：单击 → 切「按住说话」模式；长按(>400ms) → 旧 ASR 录音；
  //   2) voice 模式：单击 → 切回打字；
  //   3) 录音中：单击 → 停止录音并转写（旧能力，共用同一状态机）。
  // TASK-043：按住说话手势已接到真实录音链路——按住 voiceBar 达 HOLD_MS 后
  // startRecording() 开始录音；松开（未上滑取消）→ stopRecording → 上传 /api/asr
  // 转写并作为消息发送；上滑到取消区 → 丢弃不发送。与长按 🎙 旧入口共用
  // recorder/recordingBusy 状态机，转写中/录音中禁止再次触发。
  var micBtn = document.getElementById('micBtn');
  var voiceBar = document.getElementById('voiceBar');
  var inputMode = 'keyboard';        // 'keyboard' | 'voice'
  var press = null;                  // 按住说话手势状态 {startY, zone, via, held, timer}
  var SLIDE_CANCEL_PX = 60;          // 上滑超过该距离 → 取消区
  var HOLD_MS = 200;                 // 按住多少毫秒进入「按住说话」手势（防误触快速点按）

  var toastTimer = null;
  function showToast(text) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function setInputMode(m) {
    inputMode = m;
    if (m === 'voice') {

      input.style.display = 'none';
      voiceBar.style.display = 'block';
      micBtn.classList.add('voice-on');
      micBtn.title = '切换到打字输入';
    } else {
      input.style.display = '';
      voiceBar.style.display = 'none';
      micBtn.classList.remove('voice-on');
      micBtn.title = '切换到按住说话';
    }
  }

  function resetVoiceBar() {

  }

  // TASK-043：按当前手势/录音状态渲染 voiceBar 文案（红点+计时由 .recording 提供）
  function updateVoiceBarLabel() {
    if (!press) return;
    if (press.zone === 'cancel') {
      voiceBar.classList.add('cancel');
      voiceBar.textContent = '松开取消';
      return;
    }
    voiceBar.classList.remove('cancel');
    voiceBar.classList.add('holding');

      voiceBar.textContent = sec + 's · 松开 发送 · 上滑 取消';

    }

  function startPress(via, y) {

    press = { startY: y, zone: 'send', via: via, held: false, timer: null };
    press.timer = setTimeout(function () {          // 按住 HOLD_MS 才算手势
      if (!press) return;

  // —— 按住说话手势：触屏（touch）与桌面（mouse）双通道，防误触 ——

  // —— 麦克风按钮：单击切换模式 / 录音中单击停止 / 长按走旧 ASR 录音 ——
  var micPressTimer = null;

    if (micPressTimer) { clearTimeout(micPressTimer); micPressTimer = null; }

  function armMicLongPress() {

  var recorder = null;
  var recordingStream = null;
  var recordingChunks = [];
  var recordingBusy = false;
  var recordingSessionKey = null;
  // TASK-043 按住说话接线：录音状态机共享给「按住说话」手势入口与长按 🎙 旧入口
  var MAX_RECORD_SEC = 60;           // 录音时长上限（秒）：超过自动停止并转写，手感可调
  var recStartTs = 0;                // 本次录音开始时间戳（voiceBar 计时显示用）
  var recTickTimer = null;           // 录音计时器：红点/秒数 + 上限自动停止
  var recordingStarting = false;     // getUserMedia 授权在途（尚未真正开始录）

  function discardRecording() {

  function startRecTick() {
