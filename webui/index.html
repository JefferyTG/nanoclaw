    recTickTimer = setInterval(function () {
      if (press && press.held) updateVoiceBarLabel();
      // 超过 MAX_RECORD_SEC 秒：自动停止并转写（recorder.state 兜底，避免重复触发）
      if (recorder && recorder.state === 'recording' &&
          Date.now() - recStartTs >= MAX_RECORD_SEC * 1000) {
        showToast('已达 ' + MAX_RECORD_SEC + ' 秒录音上限，自动停止并转写。');
        stopRecording();
      }
    }, 1000);
  }

  function clearRecTick() {
    if (recTickTimer) { clearInterval(recTickTimer); recTickTimer = null; }
    voiceBar.classList.remove('recording');
    recStartTs = 0;   // 未录音时归零：避免下次按住时秒数误显示
  }

  function setRecordingState(active, busy) {
    recordingBusy = !!busy;
    micBtn.disabled = !!busy;
    micBtn.classList.toggle('recording', !!active);
    micBtn.textContent = active ? '■' : '🎙';
    micBtn.title = active ? '停止录音' : (busy ? '语音转写中…' : '切换到按住说话 · 长按录音');
    if (active) startRecTick();   // TASK-043：录音中 voiceBar 红点/计时 + 60s 上限
    else clearRecTick();
  }

  function canChangeSession() {
    if (!recorder && !recordingBusy) return true;
    addSys(recorder ? '正在录音，请先停止录音。' : '正在转写语音，请稍候。');
    return false;
  }

  function chooseRecorderOptions() {
    if (!window.MediaRecorder) return null;
    var types = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < types.length; i++) {
      if (!MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(types[i])) {
        return { mimeType: types[i] };
      }
    }
    return {};
  }

  function uploadRecording(blob, filename) {
    var fd = new FormData();
    fd.append('file', blob, filename);
    return fetch('/api/asr', { method: 'POST', body: fd })
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          if (!response.ok || !body.ok) {
            // TASK-043：复用 /api/asr 错误码映射，给出友好提示
            var code = body && body.error && body.error.code;
            var msg = body && body.error && body.error.message;
            var friendly = {
              asr_unavailable: '语音转写服务未配置或暂不可用，请稍后再试。',
              file_too_large: '录音文件过大，请缩短录音时长后重试。',
              empty_transcript: '没有识别到可发送的文字，请重新录制。',
              asr_failed: '语音转写失败，请稍后重试。'
            };
            throw new Error(friendly[code] || msg || '语音转写失败');
          }
          return String(body.text || '').trim();
        });
      });
  }

  function startRecording() {
    if (recordingBusy || recorder) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      addSys('当前浏览器不支持录音，请使用安全上下文（HTTPS 或 localhost）并换用现代浏览器。');
      return;
    }
    if (!window.isSecureContext && location.hostname !== 'localhost') {
      addSys('录音需要安全上下文：请使用 HTTPS 或 localhost 访问此页面。');
      return;
    }
    // 即使 UI 已阻止切换，会话也可能因重连/服务端事件变化；完成转写前必须
    // 仍属于开始录音时的同一会话，才允许走现有文本发送路径。
    recordingSessionKey = currentKey;
    // TASK-043：重置上次「放弃/丢弃」标记，避免误伤本次录音
    recordingStartAborted = false;
    recordingDiscarded = false;
    recordingStarting = true;
    setRecordingState(false, true);
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recordingStarting = false;
      if (recordingStartAborted) {   // TASK-043：松手/取消发生在授权完成前 → 放弃启动
        stream.getTracks().forEach(function (track) { track.stop(); });
        recordingSessionKey = null;
        setRecordingState(false, false);
        return;
      }
      recordingStream = stream;
      recordingChunks = [];
      var options = chooseRecorderOptions();
      recorder = options ? new MediaRecorder(stream, options) : new MediaRecorder(stream);
      recorder.ondataavailable = function (event) {
        if (event.data && event.data.size) recordingChunks.push(event.data);
      };
      recorder.onerror = function () {
        addSys('录音发生错误，请检查麦克风后重试。');
        recorder = null;
        stopRecordingTracks();
        recordingSessionKey = null;
        setRecordingState(false, false);
      };
      recorder.onstop = function () {
        var finished = recorder;
        recorder = null;
        stopRecordingTracks();
        var mime = (finished && finished.mimeType) || 'audio/webm';
        var blob = new Blob(recordingChunks, { type: mime });
        recordingChunks = [];
        var discarded = recordingDiscarded;   // TASK-043：上滑取消/中断 → 只复位不上传
        recordingDiscarded = false;
        if (discarded) {
          recordingSessionKey = null;
          setRecordingState(false, false);
          return;
        }
        if (!blob.size) {
          addSys('没有录到声音，请检查麦克风权限后重试。');
          recordingSessionKey = null;
          setRecordingState(false, false);
          return;
        }
        setRecordingState(false, true);   // TASK-043：转写中置忙，禁止再次触发录音
        if (press && press.held) voiceBar.textContent = '转写中…';   // 自动停止后仍按住
        var ext = mime.indexOf('mp4') >= 0 ? 'm4a' : (mime.indexOf('ogg') >= 0 ? 'ogg' : 'webm');
        uploadRecording(blob, 'recording.' + ext).then(function (text) {
          if (!text) throw new Error('没有识别到可发送的文字，请重新录制。');
          if (!ws || ws.readyState !== WebSocket.OPEN) throw new Error('连接未就绪，未发送转写文本。');
          if (currentKey !== recordingSessionKey) throw new Error('会话已变化，未发送转写文本。');
          stopTtsForTransition();
          addUser(text);
          cur = newTurn();
          updateStopBtn();   // 回合开始：按钮变「⏹ 停止」
          ws.send(text);
        }).catch(function (err) {
          addSys('语音转写失败：' + ((err && err.message) || err));
        }).finally(function () {
          recordingSessionKey = null;
          setRecordingState(false, false);
        });
      };
      recorder.start();
      setRecordingState(true, false);
    }).catch(function (err) {
      recordingStarting = false;
      stopRecordingTracks();
      recordingSessionKey = null;
      setRecordingState(false, false);
      // TASK-043：权限被拒等给出可操作提示（检查 HTTPS / 去浏览器与系统设置授权）
      var name = err && (err.name || (err.code && String(err.code)));
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
        addSys('麦克风权限被拒绝：请点击浏览器地址栏的麦克风图标或到系统设置中允许本网站使用麦克风（需通过 HTTPS 或 localhost 访问才会弹出授权）。');
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        addSys('未检测到可用麦克风设备，请检查设备连接后重试。');
      } else if (name === 'NotReadableError' || name === 'TrackStartError') {
        addSys('麦克风正被其它应用占用，请关闭占用后重试。');
      } else {
        addSys('无法启用麦克风：' + ((err && err.message) || '请检查浏览器权限。'));
      }
    });
  }

  cfgBtn.onclick = function () {
    cfgPanel.classList.toggle('show');
    if (cfgPanel.classList.contains('show')) loadConfig();
  };
  function loadConfig() {
    cfgMsg.textContent = '';
    fetch('/api/config').then(function (r) { return r.json(); }).then(function (d) {
      FIELDS.forEach(function (f) {
        var el = document.getElementById(f);
        if (el && d[f] != null) el.value = d[f];
      });
    }).catch(function (e) { cfgMsg.textContent = '加载失败：' + e; });
  }
  document.getElementById('reloadBtn').onclick = loadConfig;
  document.getElementById('saveBtn').onclick = function () {
    var payload = {};
    FIELDS.forEach(function (f) {
      var el = document.getElementById(f);
      if (el) payload[f] = el.value;
    });
    cfgMsg.textContent = '保存中…';
    fetch('/api/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (d) {
      cfgMsg.textContent = d.ok ? ('已保存。' + (d.note || '')) : ('失败：' + (d.error || ''));
    }).catch(function (e) { cfgMsg.textContent = '保存失败：' + e; });
  };

  // —— 会话侧边栏：列出历史网页会话，点击查看并接上，可删除（含本地文件）——
  var sbList = document.getElementById('sbList');
  var newBtn = document.getElementById('newBtn');
  var currentKey = null;   // 当前激活的会话标识（后端 current_key）

  // —— TASK-039 移动端：侧边栏抽屉开合（汉堡按钮 + 遮罩；桌面无副作用）——
  var sbToggle = document.getElementById('sbToggle');
  var sbMask = document.getElementById('sbMask');
  function toggleSidebar() {
    var open = document.body.classList.toggle('sb-open');
    sbToggle.setAttribute('aria-label', open ? '关闭会话列表' : '打开会话列表');
    sbToggle.title = open ? '关闭会话列表' : '打开会话列表';
  }
  function closeSidebar() { document.body.classList.remove('sb-open'); }
  sbToggle.onclick = toggleSidebar;
  sbMask.onclick = closeSidebar;

  // —— 上下文占用进度条（usage 流事件）：按会话各自保存，无数据时隐藏降级 ——
  var ctxbar = document.getElementById('ctxbar');
  var ctxFill = document.getElementById('ctxFill');
  var ctxMeta = document.getElementById('ctxMeta');
  var usageByKey = {};   // currentKey -> 最近一次 usage 事件

  function fmtTokens(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '?';
    return Number(n).toLocaleString('en-US');
  }
  function renderCtxBar() {
    var u = currentKey ? usageByKey[currentKey] : null;
    if (!u) { ctxbar.classList.add('ctx-hidden'); return; }
    // 占用语义优先「最近一次调用」（last_ratio），其次单次/回合 ratio，无则 0。
    var ratio = (typeof u.last_ratio === 'number' && isFinite(u.last_ratio)) ? u.last_ratio
              : (typeof u.ratio === 'number' && isFinite(u.ratio)) ? u.ratio : null;
    var parts = [];
    if (typeof u.turn === 'number') {
      // 回合级汇总：更直观的一整轮概览（累计输入 / 加权命中率 / 调用次数）
      if (typeof u.input_tokens === 'number') {
        parts.push('回合输入 ' + fmtTokens(u.input_tokens));
        if (typeof u.cache_ratio === 'number' && isFinite(u.cache_ratio)) {
          parts.push('缓存命中 ' + (u.cache_ratio * 100).toFixed(1) + '%');
        }
        if (typeof u.uncached === 'number') {
          parts.push('未命中 ' + fmtTokens(u.uncached));
        }
      } else if (typeof u.estimate === 'number') {
        parts.push('估算 ' + fmtTokens(u.estimate));
      }
      if (typeof u.calls === 'number') parts.push('调用×' + u.calls);
    } else if (typeof u.input_tokens === 'number') {
      parts.push('上次 input ' + fmtTokens(u.input_tokens));
      if (typeof u.cache_ratio === 'number' && isFinite(u.cache_ratio)) {
        parts.push('缓存命中 ' + (u.cache_ratio * 100).toFixed(0) + '%');
        if (typeof u.uncached === 'number') {
          parts.push('未命中 ' + fmtTokens(u.uncached));
        }
      }
    } else if (typeof u.estimate === 'number') {
      parts.push('估算 ' + fmtTokens(u.estimate));
    }
    if (typeof u.budget === 'number') parts.push('预算 ' + fmtTokens(u.budget));
    if (ratio != null) parts.push('占用 ' + (ratio * 100).toFixed(1) + '%');
    ctxFill.style.width =
      (ratio != null ? Math.min(100, Math.max(0, ratio * 100)) : 0).toFixed(1) + '%';
    ctxFill.classList.toggle('warn', ratio != null && ratio >= 0.6 && ratio < 0.85);
    ctxFill.classList.toggle('danger', ratio != null && ratio >= 0.85);
    ctxMeta.textContent = parts.length ? parts.join(' · ') : '上下文占用';
    ctxbar.classList.remove('ctx-hidden');
  }

  function relTime(iso) {
    if (!iso) return '';
    var t = new Date(iso);
    if (isNaN(t.getTime())) return iso;
    var diff = (Date.now() - t.getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    var p = iso.split('T');
    return (p[0] || iso).slice(5) + ' ' + (p[1] || '').slice(0, 5);
  }

  var _loadSessionsInflight = false;   // 在途请求标记：防止轮询与 ws 事件并发堆叠
  // TASK-046：自动接管「正在执行任务」的会话。手机/新设备打开 webui 时，
  // 如果存在 active（有在途任务）的会话且当前不在其上，自动跳转过去——
  // 这样打开就能看到任务在跑（横幅 + 后续结果自动出现），不用手动翻侧边栏。
  // 只在页面生命周期内执行一次，用户手动切换会话后不再打扰。
  function autoTakeoverActive(items) {
    if (_autoTakeoverDone) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var activeItem = null;
    for (var i = 0; i < (items || []).length; i++) {
      if (items[i].active) {
        if (!activeItem || (items[i].active_since || '') > (activeItem.active_since || '')) {
          activeItem = items[i];   // 多个活跃时选最近开始的
        }
      }
    }
    if (activeItem && activeItem.key !== currentKey) {
      _autoTakeoverDone = true;
      openSession(activeItem.key);
    }
  }

  // TASK-046：主界面「任务进行中」横幅。当前会话有在途任务时显示，并每轮
  // 轮询刷新已运行时长（分钟）。比侧边栏小徽标更显眼，断线重连也能看到任务没丢。
  function updateTaskBanner(items) {
    var banner = document.getElementById('taskBanner');
    if (!banner) return;
    var active = null;
    for (var i = 0; i < (items || []).length; i++) {
      if (items[i].key === currentKey && items[i].active) { active = items[i]; break; }
    }
    if (active) {
      var mins = 0;
      if (active.active_since) {
        var t = new Date(active.active_since).getTime();
        if (!isNaN(t)) mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
      }
      banner.style.display = 'flex';
      banner.textContent = '⏳ 任务进行中' + (mins > 0 ? (' · 已运行 ' + mins + ' 分钟') : '');
    } else {
      banner.style.display = 'none';
    }
  }

  function loadSessions() {
    // 防抖：已有在途请求则跳过本次（轮询/重连/onmessage 多次触发也不叠加）
    if (_loadSessionsInflight) return;
    _loadSessionsInflight = true;
    var prevScroll = sbList.scrollTop;   // 重渲染前记录滚动位置，结束后恢复，避免打断浏览
    fetch('/api/sessions').then(function (r) { return r.json(); }).then(function (d) {
      var items = (d && d.sessions) || [];
      sbList.innerHTML = '';
      if (!items.length) {
        var tip = document.createElement('div');
        tip.style.cssText = 'color:var(--muted);font-size:12px;padding:8px;';
        tip.textContent = '暂无历史会话。点击「＋ 新会话」开始。';
        sbList.appendChild(tip);
        updateTaskBanner([]);
        autoTakeoverActive([]);
        return;
      }
      items.forEach(function (it) {
        var el = document.createElement('div');
        el.className = 'sb-item' + (it.key === currentKey ? ' active' : '');
        el.dataset.key = it.key;   // 供轻量轮询按 key 就地更新徽标
        el.innerHTML = '<div class="sb-title"></div><div class="sb-preview"></div>'
                     + '<div class="sb-time"></div><button class="sb-del" title="删除会话">🗑</button>';
        el.querySelector('.sb-title').textContent = it.title || '(空会话)';
        el.querySelector('.sb-preview').textContent = it.preview || '';
        el.querySelector('.sb-time').textContent =
          relTime(it.updated_at) + (it.count ? (' · ' + it.count + ' 条') : '');
        // TASK-045：会话级「执行中」徽标（含开始时间，呼吸动画）
        if (it.active) {
          var badge = document.createElement('span');
          badge.className = 'sb-active';
          var sinceTxt = it.active_since ? relTime(it.active_since) : '';
          badge.textContent = sinceTxt ? ('⏳ 执行中 · ' + sinceTxt) : '⏳ 执行中';
          if (it.active_since) badge.title = '任务开始时间：' + it.active_since;
          el.appendChild(badge);
        }
        el.addEventListener('click', function (e) {
          if (e.target.classList.contains('sb-del')) return;
          openSession(it.key);
        });
        el.querySelector('.sb-del').addEventListener('click', function (e) {
          e.stopPropagation();
          deleteSession(it.key);
        });
        sbList.appendChild(el);
      });
      sbList.scrollTop = prevScroll;   // 恢复滚动位置（不打断用户在侧边栏的浏览）
      updateTaskBanner(items);          // TASK-046：主界面任务横幅随 6s 轮询刷新
      autoTakeoverActive(items);        // TASK-046：新开页面自动接管活跃任务会话
    }).catch(function (e) { console.warn('加载会话列表失败：', e); })
      .finally(function () { _loadSessionsInflight = false; });
  }

  // 打开历史会话：后端切到该标识 + 前端拉取并回放历史，之后可继续对话
  function openSession(key) {
    if (!canChangeSession()) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) { addSys('连接未就绪，无法打开会话'); return; }
    closeSidebar();   // 移动端：选中会话后自动收起抽屉
    stopTtsForTransition();
    clearSubagentTimers(cur);
    ws.send(JSON.stringify({ ctl: true, type: 'open', key: key }));
    fetch('/api/session?key=' + encodeURIComponent(key)).then(function (r) { return r.json(); }).then(function (d) {
      currentKey = key;
      renderCtxBar();
      chat.innerHTML = '';
      nearBottom = true;   // 历史回放从底部开始跟随
      cur = null;
      updateStopBtn();
      renderHistory((d && d.messages) || []);
      loadSessions();
    }).catch(function (e) { addSys('打开会话失败：' + e); });
  }

  // 新建会话：后端生成新标识，前端清屏（收到 session_changed 后高亮）
  function newSession() {
    if (!canChangeSession()) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) { addSys('连接未就绪'); return; }
    closeSidebar();   // 移动端：点击「＋ 新会话」后自动收起抽屉
    stopTtsForTransition();
    clearSubagentTimers(cur);
    ws.send(JSON.stringify({ ctl: true, type: 'new' }));
    chat.innerHTML = '';
    nearBottom = true;   // 新会话从底部开始跟随
    cur = null;
    updateStopBtn();
    currentKey = null;
    renderCtxBar();
  }

  // 删除会话：同时删本地 JSONL 文件；若正打开则自动新建一个
  function deleteSession(key) {
    if (!canChangeSession()) return;
    if (!confirm('确定删除该会话？本地记录也会一并删除，无法恢复。')) return;
    if (key === currentKey) stopTtsForTransition();
    fetch('/api/session?key=' + encodeURIComponent(key), { method: 'DELETE' })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.ok) {
          delete usageByKey[key];
          if (key === currentKey) { currentKey = null; newSession(); }
          loadSessions();
        } else { alert('删除失败：' + ((d && d.error) || '')); }
      }).catch(function (e) { alert('删除失败：' + e); });
  }

  function restoreSubagentRun(turn, run, fallback, toolResults) {
    run = run || {};
    var panel = newSubagentPanel(turn, {
      run_id: run.run_id || run.id || (fallback && fallback.run_id),
      agent_name: run.agent_name || run.name || (fallback && fallback.agent_name) || '子 Agent',
      depth: run.depth || (fallback && fallback.depth) || 0
    });
    var events = Array.isArray(run.events) ? run.events : [];
    events.forEach(function (event) {
      onSubagentEvent(turn, { run_id: panel.id, agent_name: run.agent_name || run.name, depth: run.depth, event: event });
    });
    // 新记录可以只保存摘要，不必保留完整流事件；照样恢复工具和最终结果。
    var toolSteps = Array.isArray(run.tool_steps) ? run.tool_steps : (Array.isArray(run.tools) ? run.tools : []);
    toolSteps.forEach(function (tool) {
      var card = appendSubagentTool(panel, tool);
      finishSubagentTool(card, tool);
    });
    // 子 Agent 完整结果本来就是父 spawn 工具的 tool 消息；优先用它，
    // run.final_result 只是为快速回放保留的有界摘要。
    var result = run.tool_call_id && toolResults ? toolResults[run.tool_call_id] : null;
    if (result == null) result = run.final_result;
    if (result == null) result = run.result;
    if (result == null) result = run.content;
    if (result != null && !events.length) panel.output.textContent = String(result);
    finishSubagentPanel(panel, {
      type: run.status === 'error' || run.error ? 'error' : 'done',
      status: run.status,
      ok: run.ok,
      content: events.length ? result : '',
      duration_ms: run.duration_ms
    });
  }
  // TASK-046：历史回放还原「普通工具」卡片（exec/web_search/generate_image 等，
  // 非子 Agent 派发）。纯前端展示：只渲染已落盘的 tool_calls 与 tool 结果，
  // 不改变会话存储与模型输入。
  function renderToolCardFromHistory(turn, call, toolResults) {
    var fn = call && call.function;
    if (!fn || !fn.name) return;
    var card = document.createElement('div'); card.className = 'tool-card';
    card.innerHTML = '<div class="tc-head"><span class="tc-name"></span>'
                   + '<span class="tc-status">✅ 完成</span><span class="tc-dur"></span></div>'
                   + '<div class="tc-args"></div><div class="tc-result"></div>';
    card.querySelector('.tc-name').textContent = '🔧 ' + fn.name;
    var args = '';
    try {
      var parsed = JSON.parse(fn.arguments || '{}');
      args = JSON.stringify(parsed, null, 2);
    } catch (_e) { args = fn.arguments || ''; }
    card.querySelector('.tc-args').textContent = args ? ('入参：\n' + args) : '';
    var result = toolResults[call.id];
    card.querySelector('.tc-result').textContent = (result != null && result !== '')
      ? ('结果：\n' + result) : '（历史记录未保存该工具结果）';
    card.classList.add('has-result');
    turn.activity.appendChild(card);
    turn.hadTools = true;
  }

  function oldSpawnFallback(turn, call, toolResults) {
    var fn = call && call.function;
    if (!fn || fn.name !== 'spawn_subagent') return;
    var args = {};
    try { args = JSON.parse(fn.arguments || '{}') || {}; } catch (_err) { args = {}; }
    var result = toolResults[call.id];
    restoreSubagentRun(turn, {
      run_id: 'legacy-' + (call.id || Object.keys(turn.subagentRuns).length),
      agent_name: args.agent_name || args.name || '子 Agent',
      depth: 0,
      status: 'success',
      final_result: result != null ? result : '（历史记录未保存子 Agent 结果）'
    }, null, toolResults);
  }
  // 历史回放：把磁盘消息重建为聊天视图（思考折叠、正式回答展开）
  // 合并回放：同一轮对话（一个 user 消息后的连续 assistant/tool 消息）合并渲染成
  // 一个连贯卡片——思考累积拼接、多段回复拼接、工具/子 Agent 复原，观感接近实时流式；
  // 整轮无思考则不画空面板（消除「没内容的思考」观感）。
  function finishTurn(c) {
    finishThink(c);
    c.think.classList.remove('live');
    if (!c.thinkBody.textContent.trim()) {
      c.think.style.display = 'none';            // 整轮没有思考 → 不显示空思考面板
    }
    if (!c.answerStarted) {                      // 纯工具轮（无正文）→ 给占位提示
      c.answer.classList.remove('empty');
      if (c.hadTools) c.answer.textContent = '（该回合调用了工具，详见工具记录）';
      c.answerStarted = true;
    }
  }
  function renderHistory(records) {
    var toolResults = {};
    (records || []).forEach(function (m) {
      if (m && m.role === 'tool' && m.tool_call_id) toolResults[m.tool_call_id] = m.content || '';
    });
    var cur = null;   // 当前合并中的 bot 回合（跨多条 assistant 消息累积）
    (records || []).forEach(function (m) {
      var role = m.role;
      if (role === 'user') {
        if (cur) { finishTurn(cur); cur = null; }   // 上一轮结束，开始新一轮
        // 带图片元数据的历史消息：通过 /image 端点回显缩略图
        var urls = null;
        if (m.images && m.images.length && currentKey) {
          urls = m.images.map(function (im) {
            return '/image?key=' + encodeURIComponent(currentKey) + '&id=' + encodeURIComponent(im.id || im);
          });
        }
        addUser(m.content || '', urls);
      } else if (role === 'assistant') {
        if (!cur) cur = newTurn();                // 本轮第一条 assistant → 新建回合
        if (m.reasoning_content) {                // 思考累积（多条中间步拼接）
          if (cur.thinkBody.textContent) cur.thinkBody.textContent += '\n\n';
          cur.thinkBody.textContent += m.reasoning_content;
          cur.thinkPreview.textContent = cur.thinkBody.textContent;
        }
        var txt = m.content || '';
        if (txt) {                                // 回复累积（最终步 / 分段拼接）
          if (cur.answerStarted) cur.answer.textContent += '\n\n' + txt;
          else { cur.answer.classList.remove('empty'); cur.answer.textContent = txt; cur.answerStarted = true; }
        }
        if (Array.isArray(m.tool_calls) && m.tool_calls.length) cur.hadTools = true;
        if (Array.isArray(m.subagent_runs) && m.subagent_runs.length) {
          m.subagent_runs.forEach(function (run) { restoreSubagentRun(cur, run, null, toolResults); });
          // 新格式：普通工具（exec/web_search 等）也在 tool_calls 里，一并还原
          m.tool_calls.forEach(function (call) {
            var cfn = call && call.function;
            if (cfn && cfn.name === 'spawn_subagent') return;   // 子 Agent 已在上面渲染
            renderToolCardFromHistory(cur, call, toolResults);
          });
        } else if (Array.isArray(m.tool_calls)) {
          // 升级前没有 subagent_runs：从 spawn 的 tool_call 与对应 tool 结果复原最小面板；
          // 其余普通工具还原成工具卡片。
          m.tool_calls.forEach(function (call) {
            var cfn = call && call.function;
            if (cfn && cfn.name === 'spawn_subagent') { oldSpawnFallback(cur, call, toolResults); }
            else { renderToolCardFromHistory(cur, call, toolResults); }
          });
        }
        // 回放本轮生成的图片（generate_image 落盘 + generated_images 元数据）
        if (m.generated_images && m.generated_images.length && currentKey) {
          m.generated_images.forEach(function (iid) {
            var gim = document.createElement('img');
            gim.src = '/image?key=' + encodeURIComponent(currentKey)
                    + '&id=' + encodeURIComponent(iid);
            gim.loading = 'lazy';
            cur.botImages.appendChild(gim);
          });
        }
        // 不在此结束回合：同轮后续 assistant 消息继续合并到 cur
      }
      // system / tool 消息在侧边栏回放中省略（不污染主对话视图）
    });
    if (cur) finishTurn(cur);                     // 收尾最后一个回合
    scrollChatToBottom();
  }

  // —— TASK-044 实时通话：浏览器 ⇄ /api/realtime ⇄ 豆包 S2S 全双工 ——
  // 下行 pcm_s16le 24k 直通（Web Audio AudioBuffer 播 PCM），不搬 demo 的 opus 解码。
  var callBtn = document.getElementById('callBtn');
  var callPanel = document.getElementById('callPanel');
  var callStatus = document.getElementById('callStatus');
  var callTrans = document.getElementById('callTrans');
  var callHangup = document.getElementById('callHangup');

  var CALL_INPUT_RATE = 16000;
  var CALL_FRAME_MS = 20;
  var CALL_FRAME_BYTES = CALL_INPUT_RATE * 2 * CALL_FRAME_MS / 1000; // 640B
  var CALL_REC_BUFFER = 1024;

  var callWs = null;          // /api/realtime WebSocket
  var callActive = false;     // 通话中（连接建立且未挂断）
  var callStream = null, callCtx = null, callSrc = null, callNode = null;
  var callMicOn = false;
  var callChunks = [], callBufferedBytes = 0;
  var callFrameTimer = null;
  var callPlayer = null;      // PCM 播放器（下行）

  function callBytesToBase64(bytes) {
    var binary = '';
    var step = 0x8000;
    for (var i = 0; i < bytes.length; i += step) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(binary);
  }
  function callBase64ToBytes(b64) {
    var raw = atob(b64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function callDownsampleToPcm16(input, inputRate) {
    var ratio = inputRate / CALL_INPUT_RATE;
    var length = Math.floor(input.length / ratio);
    var out = new Int16Array(length);
    for (var i = 0; i < length; i++) {
      var start = Math.floor(i * ratio);
      var end = Math.min(Math.floor((i + 1) * ratio), input.length);
      var sum = 0;
      for (var j = start; j < end; j++) sum += input[j];
      var sample = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
      out[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
    }
    return new Uint8Array(out.buffer);
  }
  function callAppend(bytes) {
    if (!bytes || !bytes.length) return;
    callChunks.push(bytes.slice());
    callBufferedBytes += bytes.length;
  }
  function callRead(target, byteCount) {
    var offset = 0;
    while (offset < byteCount && callChunks.length) {
      var chunk = callChunks[0];
      var take = Math.min(byteCount - offset, chunk.length);
      target.set(chunk.subarray(0, take), offset);
      offset += take;
      callBufferedBytes -= take;
      if (take === chunk.length) callChunks.shift();
      else callChunks[0] = chunk.subarray(take);
    }
    return offset;
  }
  function callTakeFrame() {
    if (callBufferedBytes < CALL_FRAME_BYTES) return null;
    var frame = new Uint8Array(CALL_FRAME_BYTES);
    callRead(frame, CALL_FRAME_BYTES);
    return frame;
  }
  function callSendNextFrame() {
    if (!callWs || callWs.readyState !== WebSocket.OPEN) return;
    var frame = callTakeFrame();
    if (!frame) frame = new Uint8Array(CALL_FRAME_BYTES); // 静音帧补齐 20ms
    callWs.send(JSON.stringify({ type: 'input_audio_buffer.append', audio: callBytesToBase64(frame) }));
  }
  function callStartPump() {
    if (callFrameTimer) return;
    callSendNextFrame();
    callFrameTimer = setInterval(callSendNextFrame, CALL_FRAME_MS);
  }
  function callStopPump() {
    if (callFrameTimer) { clearInterval(callFrameTimer); callFrameTimer = null; }
    callChunks = [];
    callBufferedBytes = 0;
  }

  // 下行 PCM 播放器：delta 即收即播，用 nextPlayTime 顺序衔接，不依赖 opus 解码。
  function CallPcmPlayer() {
    this.sampleRate = 24000;
    this.ctx = null;
    this.nextPlayTime = 0;
  }
  CallPcmPlayer.prototype.start = function () {
    if (!this.ctx || this.ctx.state === 'closed') {
      var AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC({ sampleRate: this.sampleRate });
    }
    if (this.ctx.state === 'suspended') return this.ctx.resume();
    return Promise.resolve();
  };
  CallPcmPlayer.prototype.enqueue = function (bytes) {
    if (!bytes || bytes.length < 2) return Promise.resolve();
    var self = this;
    return this.start().then(function () {
      var samples = Math.floor(bytes.length / 2);
      var buffer = self.ctx.createBuffer(1, samples, self.sampleRate);
      var channel = buffer.getChannelData(0);
      var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      for (var i = 0; i < samples; i++) channel[i] = view.getInt16(i * 2, true) / 32768;
      var src = self.ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(self.ctx.destination);
      var startAt = Math.max(self.nextPlayTime, self.ctx.currentTime + 0.01);
      src.start(startAt);
      self.nextPlayTime = startAt + buffer.duration;
    });
  };
  CallPcmPlayer.prototype.stop = function () {
    var ctx = this.ctx;
    this.ctx = null;
    this.nextPlayTime = 0;
    if (!ctx) return Promise.resolve();
    try {
      var p = ctx.close();
      if (p && p.catch) return p.catch(function () {});
    } catch (e) {}
    return Promise.resolve();
  };

  function callStartMic() {
    return navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).then(function (stream) {
      callStream = stream;
      var AC = window.AudioContext || window.webkitAudioContext;
      callCtx = new AC();
      callSrc = callCtx.createMediaStreamSource(stream);
      callNode = callCtx.createScriptProcessor(CALL_REC_BUFFER, 1, 1);
      callNode.onaudioprocess = function (ev) {
        if (!callMicOn) return;
        var input = ev.inputBuffer.getChannelData(0);
        callAppend(callDownsampleToPcm16(input, callCtx.sampleRate));
      };
      callSrc.connect(callNode);
      callNode.connect(callCtx.destination);
      callMicOn = true;
      callStartPump();
    });
  }
  function callStopMic() {
    callMicOn = false;
    callStopPump();
    if (callNode) { try { callNode.disconnect(); } catch (e) {} callNode = null; }
    if (callSrc) { try { callSrc.disconnect(); } catch (e) {} callSrc = null; }
    if (callStream) { callStream.getTracks().forEach(function (t) { t.stop(); }); callStream = null; }
    if (callCtx) { try { callCtx.close(); } catch (e) {} callCtx = null; }
  }
  function callMicErrorMessage(err) {
    var name = err && (err.name || (err.code && String(err.code)));
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
      return '麦克风权限被拒绝：请点击浏览器地址栏的麦克风图标或到系统设置中允许本网站使用麦克风（需通过 HTTPS 或 localhost 访问才会弹出授权）。';
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      return '未检测到可用麦克风设备，请检查设备连接后重试。';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return '麦克风正被其它应用占用，请关闭占用后重试。';
    }
    return '无法启用麦克风：' + ((err && err.message) || '请检查浏览器权限。');
  }

  function callSetStatus(text, state) {
    callStatus.textContent = text;
    callStatus.className = 'call-status' + (state ? ' ' + state : '');
  }
  function callShowPanel(show) {
    callPanel.hidden = !show;
    callBtn.disabled = !!show;   // 通话中禁用 📞（防重复点击）
  }
  function callCleanup() {
    callStopMic();
    if (callPlayer) { callPlayer.stop(); callPlayer = null; }
    if (callWs) {
      var ws = callWs;
      callWs = null;
      ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null;
      try { ws.close(); } catch (e) {}
    }
    callActive = false;
    callShowPanel(false);
    callSetStatus('未接通', '');
    callTrans.textContent = '';
  }
  function endCall() {
    if (callWs && callWs.readyState === WebSocket.OPEN) {
      try { callWs.send(JSON.stringify({ type: 'hangup' })); } catch (e) {}
    }
    callCleanup();
  }
  function callConnect() {
    if (callActive || callBtn.disabled) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      addSys('当前浏览器不支持录音，请使用安全上下文（HTTPS 或 localhost）并换用现代浏览器。');
      return;
    }
    if (!window.isSecureContext && location.hostname !== 'localhost') {
      addSys('打电话需要麦克风：请使用 HTTPS 或 localhost 访问此页面（录音需要安全上下文）。');
      showToast('打电话需要安全上下文（HTTPS 或 localhost）');
      return;
    }
    callActive = true;
    callShowPanel(true);
    callSetStatus('接通中…', '');
    callTrans.textContent = '';
    var url = proto + '://' + location.host + '/api/realtime';
    var ws = new WebSocket(url);
    callWs = ws;
    ws.onopen = function () {
      if (callWs !== ws) return;
      callSetStatus('已连接，等待会话…', '');
    };
    ws.onmessage = function (e) {
      var obj;
      try { obj = JSON.parse(e.data); } catch (err) { return; }
      var ev = obj && obj.event;
      if (!ev) return;
      var t = ev.type;
      if (t === 'realtime.ready') {
        if (callWs !== ws) return;
        callSetStatus('通话中', 'ringing');
        callPlayer = new CallPcmPlayer();
        callStartMic().catch(function (err) {
          callSetStatus('麦克风不可用', 'error');
          addSys(callMicErrorMessage(err));
          endCall();
        });
      } else if (t === 'realtime.error') {
        if (callWs !== ws) return;
        callSetStatus('无法接通', 'error');
        addSys('实时通话失败：' + (ev.message || ev.code || '未知错误'));
        showToast(ev.message || '实时通话失败');
        endCall();
      } else if (t === 'conversation.item.input_audio_transcription.started') {
        // 服务端判定用户开口（插话）→ 丢掉已排队旧音频，交服务端动态判停
        if (callPlayer) { callPlayer.stop(); callPlayer = null; }
      } else if (t === 'conversation.item.input_audio_transcription.completed') {
        var text = (ev.transcript || '').trim();
        if (text) callTrans.textContent = '你说：' + text;
      } else if (t === 'response.output_audio.started') {
        if (callPlayer) { callPlayer.stop(); callPlayer = null; }
        callPlayer = new CallPcmPlayer();
      } else if (t === 'response.output_audio.delta') {
        if (!callPlayer) callPlayer = new CallPcmPlayer();
        callPlayer.enqueue(callBase64ToBytes(ev.delta || '')).catch(function () {});
      } else if (t === 'response.done' || t === 'response.canceled') {
        callSetStatus('通话中', 'ringing');
      } else if (t === 'error') {
        if (callWs !== ws) return;
        callSetStatus('通话中断', 'error');
        addSys('实时通话服务端错误：' + ((ev.error && ev.error.message) || ev.message || '未知错误'));
        endCall();
      }
    };
    ws.onerror = function () {
      if (callWs !== ws) return;
      callSetStatus('连接错误', 'error');
    };
    ws.onclose = function () {
      if (callWs !== ws) return;
      callWs = null;
      callCleanup();
      addSys('实时通话已结束。');
    };
  }
  callBtn.onclick = function () { callConnect(); };
  callHangup.onclick = function () { endCall(); };

  newBtn.onclick = newSession;
  loadSessions();   // 首屏拉取历史会话列表

  // TASK-045：轻量轮询（每 6 秒）刷新侧边栏与会话「执行中」徽标。复用 loadSessions，
  // 自带在途防抖与滚动位置保护，不堆叠、不打断输入/滚动；ws 重连(onopen)与消息
  // 驱动的 loadSessions 共用同一函数，天然幂等。页面加载/重连后已各拉一次。
  setInterval(function () { loadSessions(); }, 6000);

  addSys('欢迎使用小奈～左侧「会话」可查看并接上历史会话，也可删除；思考过程与工具调用默认折叠为单行，点标题即可展开，并显示思考时长。');
})();
</script>
</body>
</html>
